<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260804m">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">팀 <span class="sub">2026 LCK 10개 팀 · 카드를 누르면 팀 게시판으로</span></h1>
      </div>

      <section class="card" style="margin-bottom:14px">
        <div class="card-head"><h2 class="card-title">레전드 그룹</h2></div>
        <div class="team-grid" style="padding:14px" id="legend-grid"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2 class="card-title">라이즈 그룹</h2></div>
        <div class="team-grid" style="padding:14px" id="rise-grid"></div>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260804m"></script>
  <script src="assets/vendor/supabase.min.js?v=20260804m"></script>
  <script src="assets/store.js?v=20260804m"></script>
  <script src="assets/app.js?v=20260804m"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("팀", null);

    function teamCard(row, rank) {
      const t = TEAM_MAP[row.team];
      const cum = cumulativeRankOf(row.team);
      return `
      <a class="team-card" style="--team-color:${t.color}" href="team.html?team=${t.id}">
        ${teamLogoHTML(t, 52)}
        <div style="text-align:center">
          <div class="tc-abbr">${t.abbr}</div>
          <div class="tc-name">${t.name}</div>
          <div class="tc-record">그룹 ${rank}위 · ${row.w}승 ${row.l}패</div>
          <div class="tc-record">시즌 누적 ${cum ? cum.rank + "위 · " + cum.w + "승 " + cum.l + "패" : "-"}</div>
        </div>
      </a>`;
    }
    document.getElementById("legend-grid").innerHTML =
      stageStandings("r34L").map((r, i) => teamCard(r, i + 1)).join("");
    document.getElementById("rise-grid").innerHTML =
      stageStandings("r34R").map((r, i) => teamCard(r, i + 1)).join("");

    renderFooter();
  
  });
  </script>
</body>
</html>
