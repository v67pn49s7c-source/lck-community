<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 게시판 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="team-hero" id="team-hero"></div>

  <main class="page">
    <div class="container layout">
      <div class="stack">
        <section class="card" id="board-root"></section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/board.js"></script>
  <script>initTeamPage();</script>
</body>
</html>
