  <main class="page">
    <div class="container layout">
      <div class="stack">

        <!-- 팀 게시판 글일 때만 나타난다 — 팀 게시판(team.html)과 사이드바를 똑같이 맞추기 위한 것 -->

            <span class="card-more" id="founding-count"></span>
          </div>
          <div class="founding-panel" id="founding-panel"></div>

          <div class="card-head">
