<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경기 일정 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260804g">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">경기 <span class="sub">일정 · 결과</span></h1>
          <div style="display:flex; gap:8px; align-items:center">
            <select id="tournament-select" style="min-width:200px"></select>
            <a class="btn-secondary" id="bracket-link" href="bracket.html">대진표</a>
          </div>
        </div>
        <section class="card">
          <div class="board-toolbar">
            <div class="filter-tabs" id="stage-tabs"></div>
          </div>
          <div id="matches-body"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260804g"></script>
  <script src="assets/vendor/supabase.min.js?v=20260804g"></script>
  <script src="assets/store.js?v=20260804g"></script>
  <script src="assets/app.js?v=20260804g"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("경기", null);

    const state = { tid: null, stage: "전체" };

    function renderTournamentSelect() {
      const ts = getTournaments();
      const sel = document.getElementById("tournament-select");
      if (!ts.length) {
        sel.innerHTML = `<option>등록된 대회 없음</option>`;
        return;
      }
      state.tid = state.tid || ts[0].id;
      sel.innerHTML = ts.map(t => `<option value="${t.id}" ${t.id === state.tid ? "selected" : ""}>${esc(t.name)}</option>`).join("");
      sel.onchange = () => { state.tid = sel.value; state.stage = "전체"; renderStageTabs(); renderMatches(); updateBracketLink(); };
      updateBracketLink();
    }

    function updateBracketLink() {
      document.getElementById("bracket-link").href = "bracket.html?t=" + (state.tid || "");
    }

    function renderStageTabs() {
      const t = getTournaments().find(x => x.id === state.tid);
      const el = document.getElementById("stage-tabs");
      const stages = ["전체", ...(t ? t.stages : [])];
      el.innerHTML = stages.map(s =>
        `<button data-stage="${esc(s)}" class="${state.stage === s ? "active" : ""}">${esc(s)}</button>`).join("");
      el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        state.stage = b.dataset.stage; renderStageTabs(); renderMatches();
      }));
    }

    function renderMatches() {
      let ms = sortedMatches().filter(m => m.tid === state.tid);
      if (state.stage !== "전체") ms = ms.filter(m => m.stage === state.stage);
      document.getElementById("matches-body").innerHTML = scheduleHTML(ms, { showStage: true });
    }

    renderTournamentSelect();
    renderStageTabs();
    renderMatches();
    initSidebar();
    renderFooter();
  
  });
  </script>
</body>
</html>
