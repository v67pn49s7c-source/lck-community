<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">경기 <span class="sub">최근 결과와 다음 경기</span></h1>
          <a class="btn-secondary" href="schedule.html">전체 경기 일정 ›</a>
        </div>
        <section class="card match-overview-card">
          <div class="card-head">
            <h2 class="card-title">이전 경기 <span class="sub">최근 종료 2경기</span></h2>
            <a class="card-more" href="schedule.html?view=results">지난 결과 전체 ›</a>
          </div>
          <div id="recent-matches"></div>
        </section>
        <section class="card match-overview-card">
          <div class="card-head">
            <h2 class="card-title">앞으로 할 경기 <span class="sub" id="next-day-label"></span></h2>
            <a class="card-more" href="live.html">오늘의 경기 보기 ›</a>
          </div>
          <div id="next-matches"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">전체 경기 일정</h2>
          </div>
          <div class="schedule-cta">
            <b>대회·라운드별 전체 일정</b>
            <span>지난 결과부터 앞으로의 일정까지 한 화면에서 확인하세요.</span>
            <a class="btn-primary" href="schedule.html">전체 일정 열기</a>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260816e"></script>
  <script src="assets/vendor/supabase.min.js?v=20260816e"></script>
  <script src="assets/store.js?v=20260816e"></script>
  <script src="assets/app.js?v=20260816e"></script>
  <script src="assets/story.js?v=20260816e"></script>
  <script src="assets/race.js?v=20260816e"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("경기", null);

    function drawOverview() {
      const all = sortedMatches().filter(knownTeams);
      const recent = all.filter(m => m.status === "done").slice(-2);
      const coming = all.filter(m => m.status !== "done");
      const first = coming.find(m => m.status === "live")
        || coming.find(m => new Date(m.at).getTime() > Date.now()) || coming[0];
      const day = first ? fmtDayKey(first.at) : "";
      const next = day ? coming.filter(m => fmtDayKey(m.at) === day) : [];
      document.getElementById("recent-matches").innerHTML = scheduleHTML(recent, { showStage: true });
      document.getElementById("next-matches").innerHTML = scheduleHTML(next, { showStage: true });
      document.getElementById("next-day-label").textContent = first ? fmtDay(first.at) : "";
    }

    drawOverview();

    // 저장된 사본으로 먼저 그리고, 서버 자료가 도착하면 **한 번 더** 그린다.
    // 이게 없으면 다시 찾아온 사람은 늘 '지난번 자료'를 본다 — 경기가 끝나도
    // 순위·스코어가 그대로고, 이름을 바꿔도 옛 이름이 남는다. (2026-08-07)
    storeFresh.then(drawOverview).catch(() => {});
    onStoreRefresh(drawOverview);   // 방금 들어온 경기 결과를 이 방문자에게 바로
    // 경우의 수 '정확본'은 세트 스코어까지 돌려 1초를 넘는다. 유휴 시간에 만든 뒤 한 번 더 그린다.
    raceWarmExact(changed => { if (changed) drawOverview(); });
    setupSidebarStandings();
    renderFooter();
  
  });
  </script>
</body>
</html>
