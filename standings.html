<head>

  <meta property="og:locale" content="ko_KR">

  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 순위표 — The Nexus">
  <meta property="og:description" content="2026 LCK 그룹별 순위와 시즌 누적 전적. 승패·세트 득실을 한눈에 비교하세요.">

  <meta name="twitter:card" content="summary">

</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">리그 순위 <span class="sub">2026 LCK · 포인트 = 세트 득실차</span></h1>
        </div>
        <section class="card">
          <div class="board-toolbar">
            <div class="filter-tabs" id="stage-tabs"></div>
          </div>
          <div id="standings-table"></div>
          <div class="admin-note" id="stage-note"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260806b"></script>
  <script src="assets/vendor/supabase.min.js?v=20260806b"></script>
  <script src="assets/store.js?v=20260806b"></script>
  <script src="assets/app.js?v=20260806b"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("순위", null);

    const state = { tab: "all" };

    function tabs() {
      return [{ id: "all", name: "시즌 누적" }, ...getStageRecords().map(s => ({ id: s.id, name: s.name }))];
    }

    function renderTabs() {
      const el = document.getElementById("stage-tabs");
      el.innerHTML = tabs().map(t =>
        `<button data-tab="${t.id}" class="${state.tab === t.id ? "active" : ""}">${esc(t.name)}</button>`).join("");
      el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        state.tab = b.dataset.tab; renderTabs(); renderTable();
      }));
    }

    function renderTable() {
      const rows = state.tab === "all" ? cumulativeStandings() : stageStandings(state.tab);
      document.getElementById("standings-table").innerHTML = standingsTableHTML(rows, { full: true });
      if (state.tab === "all") {
        const included = getStageRecords().filter(stageInTotal).map(s => s.name);
        const excluded = getStageRecords().filter(s => !stageInTotal(s)).map(s => s.name);
        document.getElementById("stage-note").innerHTML =
          `시즌 누적 순위 = ${included.map(esc).join(" + ")} 합산`
          + (excluded.length ? ` <span style="color:var(--text-dim)">(${excluded.map(esc).join(", ")}은 별도 대회라 미합산)</span>` : "");
      } else {
        const s = getStageRecords().find(x => x.id === state.tab);
        document.getElementById("stage-note").innerHTML =
          (s && !stageInTotal(s) ? "이 스테이지는 별도 대회로, 종합 순위에는 합산되지 않습니다. " : "")
          + "스테이지별 전적은 관리자 메뉴에서 수정할 수 있습니다.";
      }
    }

    renderTabs();
    renderTable();
    renderPredictWidget();
    renderFooter();
  
  });
  </script>
</body>
</html>
