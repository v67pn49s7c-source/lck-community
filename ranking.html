<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta property="og:url" content="https://lck-community.vercel.app/ranking.html">
  <meta property="og:site_name" content="The Nexus">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK 예측 랭킹·팬덤 적중률 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 예측 랭킹·팬덤 적중률 — The Nexus">
  <meta property="og:description" content="예측을 가장 잘 맞히는 팬은 누구인지, 어느 팀 팬덤의 적중률이 높은지 비교해 보세요.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260807y">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260807y">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260807y">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">랭킹 <span class="sub">예측 적중 랭킹 · 적중 1건당 10P</span></h1>
        </div>
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">시즌 예측 랭킹 <span class="sub">2026 LCK 정규 시즌</span></h2>
          </div>
          <div id="ranking-body"></div>
        </section>

        <section class="card" id="fandom-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">팬덤별 예측 적중률 <span class="sub">어느 팀 팬이 가장 잘 맞힐까</span></h2>
            <span class="card-more">회원 예측 기준</span>
          </div>
          <div id="fandom-body"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">포인트 안내</h2></div>
          <div class="admin-note" style="border-top:none">
            · 승부 적중 1건당 <b>10P</b><br>
            · 포인트는 등급·배지 표시에만 사용됩니다.<br>
            · 구매·판매·양도·환전은 불가능합니다.
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260807y"></script>
  <script src="assets/vendor/supabase.min.js?v=20260807y"></script>
  <script src="assets/store.js?v=20260807y"></script>
  <script src="assets/app.js?v=20260807y"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("랭킹", null);

    // 팬덤별 적중률 (응원팀을 설정한 회원의 예측만 집계 가능)
    function renderFandom() {
      const rows = fandomAccuracy();
      const card = document.getElementById("fandom-card");
      card.style.display = rows.length ? "" : "none";
      if (!rows.length) return;
      document.getElementById("fandom-body").innerHTML = rows.map((r, i) => {
        const t = TEAM_MAP[r.team];
        if (!t) return "";
        return `
        <a class="post-row" href="team.html?team=${q(t.id)}">
          <span style="width:22px;font-weight:800;color:var(--text-dim)">${i + 1}</span>
          <span style="display:flex;align-items:center;gap:7px;font-weight:800">${teamLogoHTML(t, 18)} ${esc(t.abbr)} 팬덤</span>
          <span class="post-meta">${r.hits}/${r.n} 적중</span>
          <span style="margin-left:auto;font-weight:800;color:var(--blue)">${r.pct}%</span>
        </a>`;
      }).join("") + `<div class="admin-note">응원팀을 설정한 회원의 예측만 집계합니다. 회원가입하고 우리 팀 적중률을 끌어올려 보세요!</div>`;
    }
    renderFandom();

    function renderRanking() {
      const me = myPredictionStats();
      const myNick = Auth.profile ? Auth.profile.nick : null;
      const rows = predictRanking();

      // 내 기록은 순위에 못 들었어도 맨 아래에 따로 붙여 준다
      const inList = myNick && rows.some(r => r.nick === myNick);
      const mine = (me.total > 0 && !inList)
        ? { nick: (myNick || "나") + " (나)", hit: me.hit, total: me.total,
            pct: me.total ? Math.round((me.hit / me.total) * 100) : 0, points: me.points, me: true }
        : null;

      const el = document.getElementById("ranking-body");
      if (!rows.length && !mine) {
        el.innerHTML = `<div class="empty-note">아직 순위가 없습니다.<br>
          <span style="color:var(--text-dim);font-size:12px">회원이 채점된 경기를 5경기 이상 예측하면 순위에 올라옵니다.
          비회원 기록은 순위에 넣지 않습니다.</span></div>`;
        return;
      }
      el.innerHTML = rows.map((r, i) => {
        const t = r.team ? TEAM_MAP[r.team] : null;
        return `
        <div class="rank-row ${myNick && r.nick === myNick ? "me" : ""}">
          <span class="no ${i < 3 ? "top" : ""}">${i + 1}</span>
          <span class="nick">${esc(r.nick)}${t ? `<span class="nick-badge" title="${esc(t.name)} 팬">${teamLogoHTML(t, 14)}</span>` : ""}</span>
          <span class="detail">${r.hit}/${r.total} 적중</span>
          <span class="detail">${r.pct}%</span>
          <span class="rate">${r.points}P</span>
        </div>`;
      }).join("")
      + (mine ? `<div class="rank-row me">
          <span class="no">–</span>
          <span class="nick">${esc(mine.nick)}</span>
          <span class="detail">${mine.hit}/${mine.total} 적중</span>
          <span class="detail">${mine.pct}%</span>
          <span class="rate">${mine.points}P</span>
        </div>` : "");
    }

    renderRanking();
    storeFresh.then(() => { renderRanking(); renderFandom(); }).catch(() => {});
    initSidebar();
    renderFooter();
  
  });
  </script>
</body>
</html>
