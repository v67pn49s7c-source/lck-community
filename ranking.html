<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랭킹 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260804p">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">랭킹 <span class="sub">예측 적중 랭킹 · 적중 1건당 10P</span></h1>
        </div>
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">시즌 예측 랭킹 <span class="sub">2026 스플릿 3</span></h2>
          </div>
          <div id="ranking-body"></div>
        </section>

        <section class="card" id="fandom-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">팬덤별 예측 적중률 <span class="sub">어느 팀 팬이 가장 잘 맞힐까</span></h2>
            <span class="card-more">회원 예측 기준</span>
          </div>
          <div id="fandom-body"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">포인트 안내</h2></div>
          <div class="admin-note" style="border-top:none">
            · 승부 적중 1건당 <b>10P</b><br>
            · 포인트는 등급·배지 표시에만 사용됩니다.<br>
            · 구매·판매·양도·환전은 불가능합니다.
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260804p"></script>
  <script src="assets/vendor/supabase.min.js?v=20260804p"></script>
  <script src="assets/store.js?v=20260804p"></script>
  <script src="assets/app.js?v=20260804p"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("랭킹", null);

    // 팬덤별 적중률 (응원팀을 설정한 회원의 예측만 집계 가능)
    (function renderFandom() {
      const rows = fandomAccuracy();
      if (!rows.length) return;
      const card = document.getElementById("fandom-card");
      card.style.display = "";
      document.getElementById("fandom-body").innerHTML = rows.map((r, i) => {
        const t = TEAM_MAP[r.team];
        if (!t) return "";
        return `
        <a class="post-row" href="team.html?team=${q(t.id)}">
          <span style="width:22px;font-weight:800;color:var(--text-dim)">${i + 1}</span>
          <span style="display:flex;align-items:center;gap:7px;font-weight:800">${teamLogoHTML(t, 18)} ${esc(t.abbr)} 팬덤</span>
          <span class="post-meta">${r.hits}/${r.n} 적중</span>
          <span style="margin-left:auto;font-weight:800;color:var(--blue)">${r.pct}%</span>
        </a>`;
      }).join("") + `<div class="admin-note">응원팀을 설정한 회원의 예측만 집계합니다. 회원가입하고 우리 팀 적중률을 끌어올려 보세요!</div>`;
    })();

    function renderRanking() {
      const me = myPredictionStats();
      const rows = PREDICT_RANKING.map(r => ({
        nick: r.nick, hit: r.hit, total: r.total, points: r.hit * 10, me: false,
      }));
      if (me.total + me.pending > 0) {
        rows.push({ nick: (getNick() || "나") + " (나)", hit: me.hit, total: me.total, points: me.points, me: true });
      }
      rows.sort((a, b) => b.points - a.points || (b.hit / (b.total || 1)) - (a.hit / (a.total || 1)));

      document.getElementById("ranking-body").innerHTML = rows.map((r, i) => `
        <div class="rank-row ${r.me ? "me" : ""}">
          <span class="no ${i < 3 ? "top" : ""}">${i + 1}</span>
          <span class="nick">${esc(r.nick)}</span>
          <span class="detail">${r.hit}/${r.total} 적중</span>
          <span class="detail">${r.total ? Math.round((r.hit / r.total) * 100) : 0}%</span>
          <span class="rate">${r.points}P</span>
        </div>`).join("");
    }

    renderRanking();
    initSidebar();
    renderFooter();
  
  });
  </script>
</body>
</html>
