          <div class="card-head">

            <span class="card-more" id="live-when"></span>

          <div class="match-switcher" id="match-switcher" style="display:none"></div>

      <aside class="stack live-side">
        <section class="card" id="fanpulse-card" style="display:none">

        <section class="card" id="rating-card" style="display:none">
          <div class="card-head">

            <button class="card-more" id="rating-share" style="font-weight:700">결과 저장</button>
          </div>
          <div class="live-rating-tools">
            <div class="filter-tabs" id="rating-sets"></div>
            <span class="card-more" id="rating-status"></span>
          </div>
          <div id="rating-body"></div>

        <section class="card">
          <div class="card-head">

  <script src="assets/data.js?v=20260814m"></script>
  <script src="assets/vendor/supabase.min.js?v=20260814m"></script>
  <script src="assets/invariants.js?v=20260814m"></script>
  <script src="assets/store.js?v=20260814m"></script>
  <script src="assets/app.js?v=20260814m"></script>
  <script src="assets/story.js?v=20260814m"></script>
  <script src="assets/ddragon.js?v=20260814m"></script>
  <script src="assets/race.js?v=20260814m"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("오늘의 경기", null);

    // 대상 경기: URL 지정 > LIVE 중 > 다음 경기
    const qid = new URLSearchParams(location.search).get("match");
    let match = getMatches().find(m => m.id === qid) || liveMatch() || nextMatch();

    function renderMatchSwitcher() {
      const el = document.getElementById("match-switcher");
      if (!match) { el.style.display = "none"; return; }
      const sameDay = sortedMatches().filter(m => knownTeams(m) && fmtDayKey(m.at) === fmtDayKey(match.at));
      if (sameDay.length < 2) { el.style.display = "none"; return; }
      el.style.display = "";
      el.innerHTML = `<span class="match-switcher-label">${isTodayKST(match.at) ? "오늘 경기 선택" : fmtDay(match.at)}</span>
        <div class="match-switcher-options">${sameDay.map((m, i) => `
          <a href="live.html?match=${q(m.id)}" class="${m.id === match.id ? "active" : ""}"
            aria-current="${m.id === match.id ? "page" : "false"}">
            <em>${i + 1}경기 · ${fmtTime(m.at)}</em>
            <b>${slotName(m.a)} <span>vs</span> ${slotName(m.b)}</b>
          </a>`).join("")}</div>`;
    }

    function renderBanner() {
      const el = document.getElementById("live-banner");
      if (!match) {
        el.innerHTML = `<div class="empty-note">예정된 경기가 없습니다. 관리자 메뉴에서 경기를 추가하세요.</div>`;
        return;
      }
      const live = match.status === "live", done = match.status === "done";
      document.getElementById("live-title").textContent =
        live ? "지금 경기 중" : done ? "경기 종료" : "경기 예정";
      document.getElementById("live-when").textContent = fmtWhen(match.at);
      el.innerHTML = `
        <div class="lb-team">${slotLogoHTML(match.a, 52)}<span>${slotName(match.a)}</span></div>
        <div style="text-align:center">
          ${live ? `<div class="live-badge" style="margin-bottom:6px">● LIVE</div>` : ""}
          <div class="lb-score">${(live || done) ? `${match.scoreA ?? 0} : ${match.scoreB ?? 0}` : "VS"}</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:4px">${esc(match.label || match.stage || "")}</div>
        </div>
        <div class="lb-team">${slotLogoHTML(match.b, 52)}<span>${slotName(match.b)}</span></div>`;
      renderStreams();
    }

    // ── 중계 링크 (관리자 메뉴에서 등록한 채널 주소) ──
    // 끝난 경기에는 생중계 링크를 걸지 않는다 (다시보기와 혼동되므로)
    function renderStreams() {
      const el = document.getElementById("stream-links");
      if (!el) return;
      const links = (match && match.status !== "done") ? streamsForMatch(match.id) : [];
      if (!links.length) { el.innerHTML = ""; el.style.display = "none"; return; }
      el.style.display = "";
      el.innerHTML = `<span class="sl-label">${match.status === "live" ? "지금 중계 중" : "중계 보기"}</span>`
        + links.map(l => `<a class="sl-btn ${l.key}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
             ${esc(l.name)}<em>${esc(l.note)}</em></a>`).join("");
    }

    // Leaguepedia VOD는 먼저 올라오는 Global 영상일 수 있다. 종료 경기에서는
    // 한국 LCK 공식 채널 RSS만 별도로 확인하고, 아직 없으면 업로드 대기 상태를 보여 준다.
    async function renderReplay() {
      const card = document.getElementById("replay-card");
      if (!match || match.status !== "done" || !knownTeams(match)) { card.style.display = "none"; return; }
      card.style.display = "";
      const body = document.getElementById("replay-body");
      const a = TEAM_MAP[match.a]?.abbr || match.a;
      const b = TEAM_MAP[match.b]?.abbr || match.b;
      // 유튜브에는 매치 하이라이트만 올라오고, **풀 영상(전체 경기)** 은 치지직·SOOP 에 있다.
      // 두 곳 다 공식 계정 영상 목록을 받아 **그 경기 영상 주소를 자동으로** 집어낸다.
      // (예전에는 검색어만 채운 링크였는데, 검색창에 글자만 들어가고 영상이 안 나왔다)
      let fullVodBtns = "";
      const drawFull = () => {
        const el = document.getElementById("replay-full");
        if (el) el.outerHTML = fullVodBtns;
      };
      const fullVodHTML = data => {
        const btn = (cls, label, item, channelUrl) => item
          ? `<a class="replay-full-btn ${cls}" target="_blank" rel="noopener noreferrer"
               href="${esc(item.url)}" title="${esc(item.title)}">${label}</a>`
          : `<a class="replay-full-btn ${cls} off" target="_blank" rel="noopener noreferrer"
               href="${esc(channelUrl)}" title="아직 안 올라왔습니다 — 공식 채널로 이동">${label}</a>`;
        // 치지직에는 그 경기만 담은 풀영상이 없다 — 하루 전체 방송(두 경기)뿐이라
        // 대신 **세트별 풀영상**을 세트 수만큼 걸어 준다. (사장님 확인, 2026-08-13)
        // SOOP 은 그 경기 '전체보기' 하나가 있어서 그대로 건다.
        const czSets = data?.chzzk?.sets || [];
        const sp = (data?.soop?.items || []);
        const czHTML = czSets.length
          ? czSets.map((v, i) => (i === 0
              ? btn("chzzk", `치지직 1세트`, v)
              : `<a class="replay-full-set" target="_blank" rel="noopener noreferrer"
                   href="${esc(v.url)}" title="${esc(v.title)}">${i + 1}세트</a>`)).join("")
          : btn("chzzk", "치지직", null, data?.chzzk?.channelUrl || "https://chzzk.naver.com");
        return `<div class="replay-full" id="replay-full">
          <span class="replay-full-lb">풀 영상</span>
          ${czHTML}
          ${btn("soop", "SOOP 전체보기", sp[0], data?.soop?.channelUrl || "https://www.sooplive.co.kr")}
        </div>`;
      };
      fullVodBtns = `<div class="replay-full" id="replay-full"><span class="replay-full-lb">풀 영상 찾는 중…</span></div>`;
      fetch(`/api/full-vod?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}&at=${encodeURIComponent(match.at)}`)
        .then(r => (r.ok ? r.json() : null))
        .then(d => { fullVodBtns = fullVodHTML(d); drawFull(); })
        .catch(() => { fullVodBtns = fullVodHTML(null); drawFull(); });
      body.innerHTML = `<div class="replay-pending"><b>매치 다시보기를 확인하고 있습니다</b><span>LCK 공식 채널 업로드를 기다려 주세요.</span></div>` + fullVodBtns;
      try {
        const response = await fetch(`/api/lck-vod?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}&at=${encodeURIComponent(match.at)}`);
        const data = response.ok ? await response.json() : null;
        const channel = document.getElementById("replay-channel");
        if (data?.channelUrl) channel.href = data.channelUrl;
        if (data?.status === "ready" && /^[A-Za-z0-9_-]{6,20}$/.test(data.videoId || "")) {
          body.innerHTML = `<div class="replay-frame"><iframe
            src="https://www.youtube-nocookie.com/embed/${esc(data.videoId)}" title="${esc(data.title || "LCK 매치 다시보기")}"
            loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <a class="replay-meta" href="${esc(data.url)}" target="_blank" rel="noopener noreferrer">
              <b>${esc(data.title || "LCK 매치 다시보기")}</b><span>YouTube에서 보기 ›</span></a>` + fullVodBtns;
        } else if (data?.reason === "too-early") {
          // 유튜브 하이라이트는 경기 다음 날 올라온다. 그 전에 아무거나 걸지 않는다.
          body.innerHTML = `<div class="replay-pending"><b>매치 하이라이트는 내일 올라옵니다</b>
            <span>LCK 한국 공식 채널은 경기 다음 날 하이라이트를 올립니다.
            지금은 아래 풀 영상으로 보실 수 있습니다.</span></div>` + fullVodBtns;
        } else {
          body.innerHTML = `<div class="replay-pending"><b>매치 하이라이트 준비 중</b>
            <span>LCK 한국 공식 채널에 올라오면 자동으로 연결됩니다. Global 영상은 대신 연결하지 않습니다.</span></div>` + fullVodBtns;
        }
      } catch {
        body.innerHTML = `<div class="replay-pending"><b>매치 다시보기 준비 중</b><span>잠시 후 다시 확인해 주세요.</span></div>` + fullVodBtns;
      }
    }

    // ── 팬심지수 (경기별 투표 + 팬덤별 결과) ──
    function renderFanPulse() {
      if (!match || !knownTeams(match)) return;
      const polls = pollsForMatch(match.id);
      const card = document.getElementById("fanpulse-card");
      if (!polls.length) { card.style.display = "none"; return; }
      card.style.display = "";
      const body = document.getElementById("fanpulse-body");
      // DB에서 온 id를 HTML id 속성에 넣지 않는다 (id 값이 태그를 탈출할 수 있음) — 순서로 찾는다
      body.innerHTML = polls.map(() => `<div class="poll-box"></div>`).join("");
      const boxes = body.querySelectorAll(".poll-box");
      polls.forEach((p, i) => renderPollInto(boxes[i], p, { teamA: match.a, teamB: match.b }));
    }

    // ── 경기 상세 (세트별 KDA·아이템·룬) ──
    // LoL 공식 포지션 마크. 상세 표와 팬 평점에서 같은 시각 언어를 쓴다.
    const POS_ICONS = {
      "탑": `<svg viewBox="0 0 34 34" aria-hidden="true"><path opacity=".45" fill-rule="evenodd" d="M21,14H14v7h7V14Zm5-3V26L11.014,26l-4,4H30V7.016Z"/><polygon points="4 4 4.003 28.045 9 23 9 9 23 9 28.045 4.003 4 4"/></svg>`,
      "정글": `<svg viewBox="0 0 34 34" aria-hidden="true"><path fill-rule="evenodd" d="M25,3c-2.128,3.3-5.147,6.851-6.966,11.469A42.373,42.373,0,0,1,20,20a27.7,27.7,0,0,1,1-3C21,12.023,22.856,8.277,25,3ZM13,20c-1.488-4.487-4.76-6.966-9-9,3.868,3.136,4.422,7.52,5,12l3.743,3.312C14.215,27.917,16.527,30.451,17,31c4.555-9.445-3.366-20.8-8-28C11.67,9.573,13.717,13.342,13,20Zm8,5a15.271,15.271,0,0,1,0,2l4-4c0.578-4.48,1.132-8.864,5-12C24.712,13.537,22.134,18.854,21,25Z"/></svg>`,
      "미드": `<svg viewBox="0 0 34 34" aria-hidden="true"><path opacity=".45" fill-rule="evenodd" d="M30,12.968l-4.008,4L26,26H17l-4,4H30ZM16.979,8L21,4H4V20.977L8,17,8,8h8.981Z"/><polygon points="25 4 4 25 4 30 9 30 30 9 30 4 25 4"/></svg>`,
      "원딜": `<svg viewBox="0 0 34 34" aria-hidden="true"><path opacity=".45" fill-rule="evenodd" d="M13,20h7V13H13v7ZM4,4V26.984l3.955-4L8,8,22.986,8l4-4H4Z"/><polygon points="29.997 5.955 25 11 25 25 11 25 5.955 29.997 30 30 29.997 5.955"/></svg>`,
      "서폿": `<svg viewBox="0 0 34 34" aria-hidden="true"><path fill-rule="evenodd" d="M26,13c3.535,0,8-4,8-4H23l-3,3,2,7,5-2-3-4h2ZM22,5L20.827,3H13.062L12,5l5,6Zm-5,9-1-1L13,28l4,3,4-3L18,13ZM11,9H0s4.465,4,8,4h2L7,17l5,2,2-7Z"/></svg>`,
    };
    const posIcon = pos => POS_ICONS[pos] || "";

    let curSet = 0;
    function renderDetails() {
      if (!match) return;
      const d = getDetails(match.id);
      const card = document.getElementById("details-card");
      if (!d || !d.sets.length) { card.style.display = "none"; return; }
      card.style.display = "";

      const tabsEl = document.getElementById("set-tabs");
      // 라벨은 **저장된 진짜 세트 번호**(_idx)로 찍는다. 배열 위치로 찍으면,
      // 세트가 일부만 수집된 경기에서 2세트가 "1세트"로 표시된다.
      tabsEl.innerHTML = d.sets.map((s, i) =>
        `<button data-set="${i}" class="${i === curSet ? "active" : ""}">${(s._idx ?? i) + 1}세트</button>`).join("");
      tabsEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        curSet = Number(b.dataset.set); renderDetails();
      }));

      // 원본(Leaguepedia)에 아직 안 올라온 세트가 있으면 **그렇다고 말한다.**
      // 안 그러면 2세트만 덩그러니 있는 화면을 보고 "사이트가 고장 났나" 싶다.
      // (세트 기록은 자원봉사자가 나중에 채워 넣어서 며칠 늦기도 한다)
      const wantSets = (match.scoreA ?? 0) + (match.scoreB ?? 0);
      const missing = wantSets > 0
        ? Array.from({ length: wantSets }, (_, k) => k).filter(k => !d.sets.some(s => (s._idx ?? -1) === k))
        : [];

      // 정합성 검사 (P0-2) — 세트 승수가 최종 스코어와 안 맞으면 승 배지를 감춘다.
      // 실제 사고: m8 = BFX 0:2 BRO 인데 두 세트가 a 승으로 저장돼 "BFX 세트 승"이 떴다.
      const suspect = typeof finishedMatchViolations === "function"
        && finishedMatchViolations(match, d.sets).length > 0;
      if (suspect) console.warn("[정합성] 세트 기록이 최종 스코어와 다릅니다 — 승 배지 숨김:", match.id);

      const set = d.sets[curSet];
      // 아직 수집하지 않은 경기는 딜량·시야·아이템·룬·스펠이 비어 있다.
      // 빈 칸만 줄줄이 보이면 지저분하므로, 이 세트에 값이 하나도 없는 열은 아예 숨긴다.
      const all = set.players || [];
      const has = {
        spell: all.some(p => (p.spell || "").trim()),
        dmg:   all.some(p => +p.dmg > 0),
        items: all.some(p => (p.items || "").trim()),
        runes: all.some(p => (p.runes || "").trim()),
      };
      const col = (on, html) => (on ? html : "");

      // 경기 시간("29:24") → 분. 분당 지표(DPM·CS/분)는 이걸로만 낼 수 있다.
      // 시간이 없는 세트에서는 분당 칸을 아예 그리지 않는다 (0으로 채우면 거짓말이 된다).
      const lenM = (() => {
        const m = String(((set.game || {}).len) || "").match(/(\d+)\s*:\s*(\d+)/);
        return m ? (+m[1] + +m[2] / 60) : 0;
      })();

      // 열 개수 — 팀 머리줄이 표 전체를 가로지르려면 이 값이 필요하다
      const colN = 5 + (has.dmg ? 1 : 0) + (has.items ? 1 : 0);
      // 진영(블루/레드)은 세트 기록에 있다. 없으면 표시하지 않는다.
      const sideOfTeam = s => ((set.game || {}).blue ? ((set.game || {}).blue === s ? "블루 사이드" : "레드 사이드") : "");

      // 두 팀을 **하나의 표**로 그린다. 예전에는 팀마다 표를 따로 만들어서
      // 열 너비를 못 박아 억지로 맞춰야 했고, 조금만 어긋나도 위아래가 안 맞았다.
      const half = (list, teamId, sideKey) => {
        const t = TEAM_MAP[teamId];
        const winner = set.win === "a" ? match.a : match.b;
        const won = winner === teamId;
        const maxDmg = Math.max(1, ...list.map(p => +p.dmg || 0));
        // 아이템 칸 수 — 기본 6칸. 포지션 임무로 칸이 하나 더 열리는 선수가 있어서
        // (실제 기록에 7개까지 들어온다) 그 팀에서 가장 많은 개수에 맞춰 칸을 넓힌다.
        // 팀 안에서 칸 수를 통일해야 장신구 자리가 줄마다 어긋나지 않는다.
        const itemCount = p => (p.items || "").split(",").filter(x => x.trim()).length;
        const slotN = Math.max(6, ...list.map(itemCount));
        return `
          <tbody style="--team-color:${t ? t.color : "#888"}">
            <tr class="dt-team-row"><td colspan="${colN}">
              <span class="dt-team">
                ${t ? teamLogoHTML(t, 20) : ""}<b>${slotName(teamId)}</b>
                ${suspect ? (won ? `<em class="wl">기록 확인 중</em>` : "")
                          : `<em class="wl ${won ? "w" : "l"}">${won ? "승리" : "패배"}</em>`}
                <span class="dt-team-side">${esc(sideOfTeam(sideKey))}</span>
              </span>
            </td></tr>
            ${list.map(p => {
              const pl = getPlayer(p.pid);
              const pos = lanePos(p) || (pl && pl.pos) || "";
              const dmg = +p.dmg || 0;
              const dmgPct = dmg > 0 ? Math.max(4, Math.round(dmg / maxDmg * 100)) : 0;
              const k = +p.k || 0, dd = +p.d || 0, as = +p.a || 0;
              const ratio = dd ? ((k + as) / dd).toFixed(2) : "Perfect";
              const cs = +p.cs || 0;
              return `<tr>
                <td class="dt-player">
                  <span class="dt-p">
                    <span class="dt-face">
                      ${ddChampHTML(p.champ, 46)}
                      ${has.spell ? `<span class="dt-mini">${ddSpellHTML(p.spell)}</span>` : ""}
                      ${has.runes ? `<span class="dt-mini">${ddRunesHTML(p.runes)}</span>` : ""}
                    </span>
                    <span class="dt-id">
                      ${pl ? `<a href="player.html?id=${q(pl.id)}">${esc(pl.nick)}</a>`
                           : `<b>${esc(p.pid)}</b>`}
                      <small>${esc(p.champ || "")}${pos ? ` · ${esc(pos)}` : ""}</small>
                    </span>
                  </span>
                </td>
                <td class="dt-kda" data-k="KDA">
                  <span class="dt-kda-n"><b>${k}</b> / <em>${dd}</em> / ${as}</span>
                  <!-- 이 숫자에 '평점'이라고 붙이면 이 사이트의 팬 평점과 헷갈린다.
                       열 이름이 이미 KDA 이므로 비율만 적는다. -->
                  <small>${ratio}</small>
                </td>
                ${col(has.dmg, `<td class="dt-dmg" data-k="딜량">
                  <span class="dt-dmg-n"><b>${dmg ? dmg.toLocaleString() : "-"}</b>${
                    dmg && lenM ? `<small>DPM ${Math.round(dmg / lenM)}</small>` : ""}</span>
                  <i aria-hidden="true"><b style="width:${dmgPct}%"></b></i>
                </td>`)}
                <td class="dt-num dt-vs" data-k="시야">${p.vs != null ? p.vs : "-"}</td>
                <td class="dt-num dt-cs" data-k="CS"><b>${cs}</b>${
                  lenM ? `<small>${(cs / lenM).toFixed(1)}</small>` : ""}</td>
                <td class="dt-num dt-gold" data-k="골드">${Math.round((+p.gold || 0) * 1000).toLocaleString()}</td>
                ${col(has.items, `<td class="dt-items" data-k="아이템" style="--slots:${slotN + 1}">
                  ${ddItemsHTML(p.items)}${
                    // 빈 칸도 자리를 채운다 — 줄마다 장신구가 같은 자리에 오게 하려면 필요하다
                    Array.from({ length: Math.max(0, slotN - itemCount(p)) },
                      () => `<span class="dt-slot-empty" aria-hidden="true"></span>`).join("")}
                  <span class="dt-trinket">${p.trinket ? ddItemsAny(p.trinket) : `<span class="dt-slot-empty" aria-hidden="true"></span>`}</span>
                </td>`)}
              </tr>`;
            }).join("")}
          </tbody>`;
      };
      // 챔피언이 기록된(=출전한) 선수만, 그 세트의 편 기준으로 나눠서 표시
      // (현재 소속으로 가르면 이적 선수가 반대편에 들어간다 — setSides 가 그것까지 처리한다)
      const playersInSet = set.players.filter(p => (p.champ || "").trim());
      const sideOf = setSides(match, playersInSet);
      const aList = [], bList = [];
      playersInSet.forEach(p => (sideOf[p.pid] === "b" ? bList : aList).push(p));
      // 탑 → 정글 → 미드 → 원딜 → 서폿 순으로.
      // 리그피디아는 **선수 이름 알파벳순**으로 주기 때문에, 정렬하지 않으면
      // 탑·미드·서폿·정글·원딜처럼 뒤죽박죽으로 나온다. (2026-08-07)
      aList.sort(byLanePos); bList.sort(byLanePos);
      // 세트 스코어보드(밴픽·오브젝트·골드)를 표 위에 얹는다.
      // 아직 재수집하지 않은 세트는 재료가 없어 빈 문자열이 돌아온다.
      document.getElementById("details-body").innerHTML =
        (missing.length
          ? `<div class="detail-missing">${missing.map(k => k + 1).join("·")}세트 기록이 아직 없습니다
             <span>경기 기록은 Leaguepedia 에 올라온 뒤 자동으로 채워집니다 — 보통 하루 안에 들어옵니다.</span></div>`
          : "") +
        setScoreboardHTML(match, set) + `
        <div class="page-title-row detail-stats-title"><h3 class="page-title">선수 스탯</h3></div>
        <div class="table-scroll">
        <table class="detail-table">
          <colgroup>
            <col class="c-player"><col class="c-kda">${col(has.dmg, `<col class="c-dmg">`)}
            <col class="c-vs"><col class="c-cs"><col class="c-gold">${col(has.items, `<col class="c-items">`)}
          </colgroup>
          <thead><tr><th>선수</th><th>KDA</th>${col(has.dmg, "<th>딜량</th>")}
            <th class="ta-r">시야</th><th class="ta-r">CS</th><th class="ta-r">골드</th>
            ${col(has.items, "<th>아이템</th>")}</tr></thead>
          ${half(aList, match.a, "a")}${half(bList, match.b, "b")}
        </table>
        </div>`;
    }

    // ── 팬심 평점 (경기 종료 후 · 아군/상대/중립 분리 + POG) ──
    // ⚠ 이 값은 **저장되는 세트 번호 그 자체**다 (배열 위치가 아니다).
    //   배열 위치로 두면 세트가 일부만 수집된 경기에서 엉뚱한 세트에 평점이 붙는다.
    let rateSet = 0;                       // 지금 평가 중인 세트 (진짜 set_index)
    function renderRatingPanel() {
      if (!match) return;
      const card = document.getElementById("rating-card");
      const det = getDetails(match.id);
      // 세트 기록이 없으면 누가 나왔는지 알 수 없어 평가를 열지 않는다
      if (match.status !== "done" || !knownTeams(match) || !det || !det.sets.length) {
        card.style.display = "none"; return;
      }
      card.style.display = "";
      const idxOf = s => s._idx ?? 0;
      if (!det.sets.some(s => idxOf(s) === rateSet)) rateSet = idxOf(det.sets[0]);

      // 세트 고르기
      const tabs = document.getElementById("rating-sets");
      tabs.innerHTML = det.sets.map(s =>
        `<button data-rset="${idxOf(s)}" class="${idxOf(s) === rateSet ? "active" : ""}">${idxOf(s) + 1}세트</button>`).join("");
      tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        rateSet = Number(b.dataset.rset); renderRatingPanel();
      }));

      const open = ratingOpen(match);        // 경기 후 48시간까지만 받는다 (서버와 같은 규칙)
      const myAll = getRatings()[match.id] || {};
      const myRatings = myAll[rateSet] || {};
      const ratedCount = Object.keys(myRatings).length;
      document.getElementById("rating-status").textContent = !open ? "평점 마감"
        : ratedCount ? `${rateSet + 1}세트 ${ratedCount}명 평가함` : `${rateSet + 1}세트 아직 평가 안 함`;

      const pog = pogForMatch(match.id);
      const pom = pomForMatch(match.id); // LCK 공식 경기 MVP
      const rows = fanRatingRows(match, rateSet);   // 이 세트에 나온 선수만
      const tA = TEAM_MAP[match.a], tB = TEAM_MAP[match.b];
      const tierOf = a => a >= 9 ? "t9" : a >= 8 ? "t8" : a >= 7 ? "t7" : a >= 6 ? "t6" : "t5";

      // 선수 칸 (dir: left=왼쪽 팀, right=오른쪽 팀 — 점수 배지가 가운데를 향하도록 미러)
      const cell = (x, team, opp, dir) => {
        if (!x) return `<div class="frate fv-cell empty ${dir}"></div>`;
        const { p, s } = x;
        const my = myRatings[p.id];
        const isPog = pog && pog.pid === p.id;
        const respect = s.opp && s.opp.n >= 2 && s.opp.avg >= 8;
        const gap = (s.home && s.opp) ? Math.round((s.home.avg - s.opp.avg) * 10) / 10 : null;
        // 교체 출전(전 세트를 뛰지 않은 선수) — 왜 이 선수가 목록에 있는지 보이게 한다
        const isSub = x.setsComplete && x.sets && x.totalSets && x.sets < x.totalSets;   // 세트를 다 모은 경기에서만
        return `
        <div class="frate fv-cell ${dir} ${isPog ? "pog" : ""}">
          <div class="fr-head">
            <a class="fr-player" href="player.html?id=${q(p.id)}"><span class="fv-teamtag team-text" style="--team-color:${team.color}">${team.abbr}</span> <b>${esc(p.nick)}</b></a>
            ${isSub ? `<span class="fr-sub" title="이 경기 ${x.totalSets}세트 중 ${x.sets}세트만 나왔습니다">${x.sets}/${x.totalSets}세트</span>` : ""}
            ${pom && pom.player_id === p.id ? `<span class="chip-pom" title="LCK 공식 경기 MVP · ${pom.pts}pt">POM<em> +${pom.pts}pt</em></span>` : ""}
            ${isPog ? `<span class="fr-pog">👑<em> 팬 선정 POG</em></span>` : ""}
            ${respect ? `<span class="fr-respect">상대 팬도 인정</span>` : ""}
            <span class="fr-badge ${s.all ? tierOf(s.all.avg) : "none"}">${s.all ? s.all.avg.toFixed(1) : "—"}</span>
          </div>
          ${s.all ? `
          <div class="fr-cuts">
            ${/* 값이 있는 팬덤만 보여 준다 — 참여가 적을 때 줄표만 늘어서 지저분했다 */""
              + (s.home ? `<span class="fr-cut"><i style="background:${team.color}"></i><em>아군 </em>${s.home.avg.toFixed(1)}</span>` : "")
              + (s.opp ? `<span class="fr-cut"><i style="background:${opp.color}"></i><em>상대 </em>${s.opp.avg.toFixed(1)}</span>` : "")
              + (s.neu ? `<span class="fr-cut" title="제3팀 팬·응원팀 미등록 포함"><i></i><em>기타 </em>${s.neu.avg.toFixed(1)}</span>` : "")}
            ${gap != null ? `<span class="fr-gap">팬심 온도차 ${gap > 0 ? "+" : ""}${gap.toFixed(1)}</span>` : ""}
            <span class="fr-gap">${s.all.n}명 참여</span>
          </div>` : `
          <div class="fr-cuts">
            <span class="fr-gap">아직 평가가 없습니다 — 첫 평점을 남겨 보세요</span>
          </div>`}
          ${open ? `
          <div class="fr-mine">
            <div class="rr-scores">
              ${Array.from({ length: 10 }, (_, i) => i + 1).map(n =>
                `<button class="rr-btn ${my === n ? "active" : ""} ${my != null && n <= my ? "filled" : ""}"
                  data-pid="${esc(p.id)}" data-score="${n}">${n}</button>`).join("")}
            </div>
            <span class="rr-my">${my != null ? my.toFixed(0) + "점" : "-"}</span>
          </div>` : ""}
        </div>`;
      };

      document.getElementById("rating-body").innerHTML =
        `<div class="frate-vs">
          <div class="fv-teamhead" style="--team-color:${tA.color}">${teamLogoHTML(tA, 20)} <b>${tA.abbr}</b></div>
          <div class="fv-vs">VS</div>
          <div class="fv-teamhead right" style="--team-color:${tB.color}"><b>${tB.abbr}</b> ${teamLogoHTML(tB, 20)}</div>
          ${rows.map(r =>
            // fv-row는 넓은 화면에서 display:contents (그리드 그대로), 좁은 화면에서는
            // 포지션 라벨 + 두 팀 카드가 세로로 묶이는 단위가 된다
            `<div class="fv-row">` +
              cell(r.a, tA, tB, "left") +
              `<div class="fv-pos">${posIcon(r.pos)}<span>${esc(r.pos)}</span></div>` +
              cell(r.b, tB, tA, "right") +
            `</div>`).join("")}
        </div>` +
        (open
          ? `<div class="admin-note">평점은 <b>세트마다 따로</b> 매깁니다 — 위에서 세트를 고르세요.
            그 세트에 <b>실제로 출전한 선수만</b> 나옵니다. 선수 이름 옆 숫자는 이 경기에서 뛴 세트 수입니다.<br>
            경기 전체 평점(선수 페이지·결과 카드)은 세트 평점을 모두 합쳐 계산합니다.
            누르면 바로 저장되고 다시 누르면 수정됩니다. 평점은 <b>경기 후 48시간</b>까지 받습니다.<br>
            아군·상대 구분은 로그인 회원의 응원팀 기준이며, <b>기타</b>에는 제3팀 팬과 응원팀 미설정 참여가 함께 들어갑니다.</div>`
          : `<div class="admin-note"><b>평점이 마감된 경기입니다</b> (경기 후 48시간).
            표가 더 들어오지 않으므로 위 숫자는 이대로 확정입니다.
            아군·상대 구분은 로그인 회원의 응원팀 기준이며, <b>기타</b>에는 제3팀 팬과 응원팀 미설정 참여가 함께 들어갑니다.</div>`);

      document.querySelectorAll(".rr-btn").forEach(b => b.addEventListener("click", () => {
        setRating(match.id, rateSet, b.dataset.pid, Number(b.dataset.score));
        renderRatingPanel();
      }));
    }
    document.getElementById("rating-share").addEventListener("click", () => {
      if (match) shareRatingCard(match);
    });

    // ── 미리보기 (예정 경기 전용) — 상대 전적 · 최근 5경기 · 이 경기에 걸린 것 ──
    // "경기 전엔 알아보러 온다" — 예정 경기 페이지가 투표만 있고 정보가 없던 걸 채운다.
    function renderPreview() {
      const card = document.getElementById("preview-card");
      if (!match || match.status === "done" || !knownTeams(match)) { card.style.display = "none"; return; }
      const A = TEAM_MAP[match.a], B = TEAM_MAP[match.b];
      const done = getMatches().filter(x => x.status === "done"
        && x.scoreA != null && x.scoreB != null && x.scoreA !== x.scoreB);
      let hA = 0, hB = 0;
      done.forEach(x => {
        if (x.a === match.a && x.b === match.b) (x.scoreA > x.scoreB ? hA++ : hB++);
        if (x.a === match.b && x.b === match.a) (x.scoreA > x.scoreB ? hB++ : hA++);
      });
      const form = t => done.filter(x => x.a === t || x.b === t)
        .sort((x, y) => new Date(y.at) - new Date(x.at)).slice(0, 5).reverse()
        .map(x => ((x.a === t) === (x.scoreA > x.scoreB)) ? "승" : "패").join("") || "-";

      // 경우의 수 — 같은 그룹 경기일 때만 (race.js)
      let stakes = "";
      const sid = Object.keys(RACE_CUTS).find(id => {
        const ts = (Cache.records.find(s => s.id === id)?.records || []).map(r => r.team);
        return ts.includes(match.a) && ts.includes(match.b);
      });
      if (sid) {
        const r0 = raceFromCache(sid);
        if (r0 && r0.remain.some(x => x.id === match.id)) {
          const ci = r0.cuts.length - 1, cut = r0.cuts[ci];   // 진출·생존선이 가장 와닿는다
          const ifA = raceWhatIf(sid, match.id, "a"), ifB = raceWhatIf(sid, match.id, "b");
          // 화면·카드·경우의 수 페이지가 전부 같은 말을 쓰도록 raceSay 하나로 모은다
          const f = (res, t) => {
            const row = res?.rows.find(x => x.team === t);
            return row ? raceSay(row, row.cuts[ci]).head : "-";
          };
          stakes = `<div class="admin-note"><b>${esc(cut.what)}</b>가 걸린 경기입니다 — 이기면·지면 확정까지 남는 승수:
            <b class="team-text" style="--team-color:${A.color}">${esc(A.abbr)}</b> 이기면 ${esc(f(ifA, match.a))} · 지면 ${esc(f(ifB, match.a))} &nbsp;/&nbsp;
            <b class="team-text" style="--team-color:${B.color}">${esc(B.abbr)}</b> 이기면 ${esc(f(ifB, match.b))} · 지면 ${esc(f(ifA, match.b))}
            &nbsp;<a href="race.html?team=${q(match.a)}" style="text-decoration:underline">경우의 수 전체 →</a></div>`;
        }
      }
      card.style.display = "";
      document.getElementById("preview-body").innerHTML = `
        <div class="stat-cards" style="padding:12px 16px ${stakes ? "4px" : "14px"}">
          <div class="stat-card"><div class="k">올 시즌 상대 전적</div>
            <div class="v">${hA} : ${hB}</div><div class="k">${esc(A.abbr)} : ${esc(B.abbr)}</div></div>
          <div class="stat-card"><div class="k">${esc(A.abbr)} 최근 5경기</div>
            <div class="v" style="font-size:17px;letter-spacing:3px">${form(match.a)}</div><div class="k">왼쪽이 과거</div></div>
          <div class="stat-card"><div class="k">${esc(B.abbr)} 최근 5경기</div>
            <div class="v" style="font-size:17px;letter-spacing:3px">${form(match.b)}</div><div class="k">왼쪽이 과거</div></div>
        </div>
        ${stakes}`;
    }

    // ── 경기 토론 (경기방) — 자동 생성되는 "[경기 토론]" 글의 댓글을 이 화면에서 그대로 ──
    // 참여 사다리의 마지막 칸: 2초 투표를 마친 사람이 30초 의견으로 넘어오는 자리.
    function renderTalk() {
      const card = document.getElementById("talk-card");
      const post = match ? matchTalkPost(match.id) : null;
      if (!post) { card.style.display = "none"; return; }
      card.style.display = "";
      document.getElementById("talk-more").href = "post.html?id=" + q(post.id);
      document.getElementById("talk-sub").textContent = post.comments.length ? `댓글 ${post.comments.length}` : "";
      const list = post.comments.slice().sort((a, b) => a.ts - b.ts);
      document.getElementById("talk-body").innerHTML = `
        <div id="talk-list">
          ${list.map(c => `
            <div class="comment-row">
              <div class="c-meta"><b>${nickHTML(c.nick, c.author_team)}</b><span>${fmtAgo(c.ts)}</span></div>
              <div class="c-body">${esc(c.body)}</div>
            </div>`).join("")
            || `<div class="empty-note">${match.status === "done"
                 ? "오늘 경기, 어떻게 보셨나요? 첫 소감을 남겨 보세요"
                 : "예측 이유·관전 포인트를 첫 댓글로 남겨 보세요"}</div>`}
        </div>
        <form class="comment-form" id="talk-form">
          <input class="nick" value="${esc(Auth.profile ? Auth.profile.nick : "익명 (자동 부여)")}" readonly style="max-width:140px"
            title="${Auth.profile ? "회원 닉네임은 프로필에서만 바꿀 수 있습니다" : "비회원 댓글은 익명으로 등록됩니다"}">
          ${Auth.session ? "" : `<input class="pw" type="password" placeholder="비밀번호(4자+)" required minlength="4" maxlength="20" autocomplete="new-password" style="max-width:130px">`}
          <input class="body" placeholder="왜 그렇게 보셨나요? 한 줄이면 충분합니다" required maxlength="300">
          <button class="btn-primary" type="submit">등록</button>
        </form>`;
      document.getElementById("talk-form").addEventListener("submit", e => {
        e.preventDefault();
        const body = e.target.querySelector(".body").value.trim();
        const pw = e.target.querySelector(".pw")?.value || "";
        if (!body) return;
        if (!Auth.session && pw.length < 4) { alert("비밀번호를 4자 이상 입력해 주세요. (댓글 삭제에 씁니다)"); return; }
        addComment(post.id, "", body, pw).then(r => {
          if (r && r.error) alert("댓글을 등록하지 못했습니다.\n" + (r.error.message || ""));
          renderTalk();
        });
        renderTalk();
      });
    }

    renderMatchSwitcher();
    renderBanner();
    renderReplay();
    // 중계 링크·팬 평점·투표 결과는 지난 방문 스냅샷에 없거나 오래됐을 수 있어,
    // 서버 데이터가 도착하면 다시 그린다
    const drawAll = () => {
      match = getMatches().find(m => m.id === (qid || match?.id)) || liveMatch() || nextMatch();
      renderMatchSwitcher(); renderBanner(); renderStreams(); renderReplay(); renderFanPulse();
      renderDetails(); renderRatingPanel(); renderPreview(); renderTalk(); setupSidebarStandings();
    };
    storeFresh.then(drawAll).catch(() => {});
    onStoreRefresh(drawAll);        // 경기가 끝나 결과가 들어오면 이 화면이 바로 바뀐다
    renderFanPulse();
    renderDetails();
    ddInit().then(ok => { if (ok) renderDetails(); }); // 아이템·룬·스펠 아이콘 로드 후 다시 그림
    renderRatingPanel();
    renderPreview();
    renderTalk();
    setupSidebarStandings();
    renderFooter();
  });
  </script>
</body>
</html>
