<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이브 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" id="live-title">라이브</h2>
            <span class="card-more" id="live-when"></span>
          </div>
          <div class="live-banner" id="live-banner"></div>
        </section>

        <section class="card" id="fanpulse-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">팬심지수 <span class="sub">전체 · 양 팀 팬 · 중립의 여론 비교</span></h2>
            <span class="card-more">비회원도 투표 가능</span>
          </div>
          <div id="fanpulse-body"></div>
        </section>

        <section class="card" id="discuss-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">경기 토론</h2>
            <a class="btn-primary" id="discuss-write" href="#" style="font-size:12px; padding:5px 14px">글쓰기</a>
          </div>
          <div id="discuss-body"></div>
        </section>

        <section class="card" id="details-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">경기 상세 <span class="sub">KDA · 아이템 · 룬</span></h2>
            <div class="filter-tabs" id="set-tabs"></div>
          </div>
          <div id="details-body"></div>
        </section>

        <section class="card" id="rating-card" style="display:none">
          <div class="card-head">
            <h2 class="card-title">팬심 평점 <span class="sub">아군·상대·중립 팬이 나눠 매기는 10점 평점</span></h2>
            <span style="display:flex;align-items:center;gap:12px">
              <span class="card-more" id="rating-status"></span>
              <button class="card-more" id="rating-share" style="font-weight:700">📷 결과 카드 저장</button>
            </span>
          </div>
          <div id="rating-body"></div>
        </section>

      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">오늘·다음 경기</h2>
          </div>
          <div id="upcoming-list"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("라이브", null);

    // 대상 경기: URL 지정 > LIVE 중 > 다음 경기
    const qid = new URLSearchParams(location.search).get("match");
    const match = getMatches().find(m => m.id === qid) || liveMatch() || nextMatch();

    function renderBanner() {
      const el = document.getElementById("live-banner");
      if (!match) {
        el.innerHTML = `<div class="empty-note">예정된 경기가 없습니다. 관리자 메뉴에서 경기를 추가하세요.</div>`;
        return;
      }
      const live = match.status === "live", done = match.status === "done";
      document.getElementById("live-title").textContent =
        live ? "라이브" : done ? "경기 종료" : "경기 예정";
      document.getElementById("live-when").textContent = fmtWhen(match.at);
      el.innerHTML = `
        <div class="lb-team">${slotLogoHTML(match.a, 52)}<span>${slotName(match.a)}</span></div>
        <div style="text-align:center">
          ${live ? `<div class="live-badge" style="margin-bottom:6px">● LIVE</div>` : ""}
          <div class="lb-score">${(live || done) ? `${match.scoreA ?? 0} : ${match.scoreB ?? 0}` : "VS"}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px">${esc(match.label || match.stage || "")}</div>
        </div>
        <div class="lb-team">${slotLogoHTML(match.b, 52)}<span>${slotName(match.b)}</span></div>`;
    }

    // ── 팬심지수 (경기별 투표 + 팬덤별 결과) ──
    function renderFanPulse() {
      if (!match || !knownTeams(match)) return;
      const polls = pollsForMatch(match.id);
      const card = document.getElementById("fanpulse-card");
      if (!polls.length) { card.style.display = "none"; return; }
      card.style.display = "";
      const body = document.getElementById("fanpulse-body");
      body.innerHTML = polls.map(p => `<div class="poll-box" id="poll-${p.id}"></div>`).join("");
      polls.forEach(p => renderPollInto(
        document.getElementById("poll-" + p.id), p, { teamA: match.a, teamB: match.b }));
    }

    // ── 경기 토론 글 ──
    function renderDiscuss() {
      if (!match) return;
      const card = document.getElementById("discuss-card");
      card.style.display = "";
      document.getElementById("discuss-write").href = "write.html?match=" + match.id;
      const posts = postsForMatch(match.id).sort((a, b) => b.ts - a.ts).slice(0, 8);
      document.getElementById("discuss-body").innerHTML = posts.length
        ? posts.map(p => `
          <a class="post-row" href="post.html?id=${p.id}">
            <span class="tag-cat">${esc(p.cat)}</span>
            <span class="post-title">${esc(p.title)}</span>
            <span class="post-meta"><span class="up">▲ ${p.up}</span><span class="cmt">💬 ${p.comments.length}</span><span>${fmtAgo(p.ts)}</span></span>
          </a>`).join("")
        : `<div class="empty-note">이 경기 관련 첫 글을 남겨 보세요!</div>`;
    }

    // ── 경기 상세 (세트별 KDA·아이템·룬) ──
    let curSet = 0;
    function renderDetails() {
      if (!match) return;
      const d = getDetails(match.id);
      const card = document.getElementById("details-card");
      if (!d || !d.sets.length) { card.style.display = "none"; return; }
      card.style.display = "";

      const tabsEl = document.getElementById("set-tabs");
      tabsEl.innerHTML = d.sets.map((s, i) =>
        `<button data-set="${i}" class="${i === curSet ? "active" : ""}">${i + 1}세트</button>`).join("");
      tabsEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        curSet = Number(b.dataset.set); renderDetails();
      }));

      const set = d.sets[curSet];
      const half = (list, teamId) => {
        const t = TEAM_MAP[teamId];
        const winner = set.win === "a" ? match.a : match.b;
        return `
        <div class="detail-team-head" style="--team-color:${t ? t.color : "#888"}">
          ${t ? teamLogoHTML(t, 20) : ""} <b>${slotName(teamId)}</b>
          ${winner === teamId ? `<span class="cat-chip notice">세트 승</span>` : ""}
        </div>
        <table class="detail-table">
          <thead><tr><th>선수</th><th>챔피언</th><th>KDA</th><th>CS</th><th>골드</th><th>아이템</th><th>룬</th></tr></thead>
          <tbody>
            ${list.map(p => {
              const pl = getPlayer(p.pid);
              return `<tr>
                <td class="dt-player">${pl ? `<a href="player.html?id=${pl.id}">${esc(pl.nick)}</a><span class="pos">${esc(pl.pos)}</span>` : esc(p.pid)}</td>
                <td class="dt-champ">${esc(p.champ)}</td>
                <td class="dt-kda"><b>${p.k}</b> / <em>${p.d}</em> / ${p.a}</td>
                <td>${p.cs}</td>
                <td>${p.gold}k</td>
                <td class="dt-items">${esc(p.items)}</td>
                <td class="dt-runes">${esc(p.runes)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`;
      };
      const aList = set.players.slice(0, 5), bList = set.players.slice(5, 10);
      document.getElementById("details-body").innerHTML = half(aList, match.a) + half(bList, match.b);
    }

    // ── 팬심 평점 (경기 종료 후 · 아군/상대/중립 분리 + POG) ──
    function renderRatingPanel() {
      if (!match) return;
      const card = document.getElementById("rating-card");
      if (match.status !== "done" || !knownTeams(match)) { card.style.display = "none"; return; }
      card.style.display = "";

      const myRatings = getRatings()[match.id] || {};
      const ratedCount = Object.keys(myRatings).length;
      document.getElementById("rating-status").textContent =
        ratedCount ? `내 평가 ${ratedCount}명 완료` : "아직 평가하지 않음";

      const pog = pogForMatch(match.id);
      const played = playedPidsForMatch(match.id); // 경기 상세 기록이 있으면 출전 선수만
      const tierOf = a => a >= 9 ? "t9" : a >= 8 ? "t8" : a >= 7 ? "t7" : a >= 6 ? "t6" : "t5";

      const teamBlock = (teamId, oppId) => {
        const t = TEAM_MAP[teamId], o = TEAM_MAP[oppId];
        let players = teamPlayers(teamId);
        if (played.size) players = players.filter(p => played.has(p.id));
        return `
        <div class="detail-team-head" style="--team-color:${t.color}">${teamLogoHTML(t, 20)} <b>${t.abbr}</b></div>
        ${players.map(p => {
          const my = myRatings[p.id];
          const s = fanSplitForPlayer(p.id, match.id, teamId, oppId);
          const isPog = pog && pog.pid === p.id;
          const respect = s.opp && s.opp.n >= 2 && s.opp.avg >= 8;
          const gap = (s.home && s.opp) ? Math.round((s.home.avg - s.opp.avg) * 10) / 10 : null;
          return `
          <div class="frate ${isPog ? "pog" : ""}">
            <div class="fr-head">
              <a class="fr-player" href="player.html?id=${p.id}"><span class="pos">${esc(p.pos)}</span> <b>${esc(p.nick)}</b></a>
              ${isPog ? `<span class="fr-pog">👑 팬 선정 POG</span>` : ""}
              ${respect ? `<span class="fr-respect">상대 팬도 인정</span>` : ""}
              <span class="fr-badge ${s.all ? tierOf(s.all.avg) : "none"}">${s.all ? s.all.avg.toFixed(1) : "—"}</span>
            </div>
            ${s.all ? `
            <div class="fr-cuts">
              <span class="fr-cut"><i style="background:${t.color}"></i>아군 ${s.home ? s.home.avg.toFixed(1) : "—"}</span>
              <span class="fr-cut"><i style="background:${o.color}"></i>상대 ${s.opp ? s.opp.avg.toFixed(1) : "—"}</span>
              <span class="fr-cut"><i></i>중립 ${s.neu ? s.neu.avg.toFixed(1) : "—"}</span>
              ${gap != null ? `<span class="fr-gap">팬심 온도차 ${gap > 0 ? "+" : ""}${gap.toFixed(1)}</span>` : ""}
              <span class="fr-gap">${s.all.n}명 참여</span>
            </div>` : `
            <div class="fr-cuts"><span class="fr-gap">아직 평가가 없습니다 — 첫 평점을 남겨 보세요</span></div>`}
            <div class="fr-mine">
              <div class="rr-scores">
                ${Array.from({ length: 10 }, (_, i) => i + 1).map(n =>
                  `<button class="rr-btn ${my === n ? "active" : ""} ${my != null && n <= my ? "filled" : ""}"
                    data-pid="${p.id}" data-score="${n}">${n}</button>`).join("")}
              </div>
              <span class="rr-my">${my != null ? my.toFixed(0) + "점" : "-"}</span>
            </div>
          </div>`;
        }).join("")}`;
      };

      document.getElementById("rating-body").innerHTML =
        `<div class="frate-grid">
          <div>${teamBlock(match.a, match.b)}</div>
          <div>${teamBlock(match.b, match.a)}</div>
        </div>` +
        `<div class="admin-note">평점은 즉시 저장되며 바로 반영됩니다 (1인 1표, 다시 누르면 수정).
          아군·상대 구분은 로그인 회원의 응원팀 설정 기준이며, 비회원·응원팀 미설정은 중립으로 집계됩니다.${
          played.size ? " 경기 상세에 기록된 출전 선수만 표시됩니다." : ""}</div>`;

      document.querySelectorAll(".rr-btn").forEach(b => b.addEventListener("click", () => {
        setRating(match.id, b.dataset.pid, Number(b.dataset.score));
        renderRatingPanel();
      }));
    }
    document.getElementById("rating-share").addEventListener("click", () => {
      if (match) shareRatingCard(match);
    });

    // 사이드: 다가오는 경기 목록
    function renderUpcoming() {
      const ms = sortedMatches().filter(m => m.status !== "done").slice(0, 6);
      document.getElementById("upcoming-list").innerHTML =
        ms.map(m => `
          <a class="post-row" href="live.html?match=${m.id}">
            <span style="display:flex;align-items:center;gap:5px;font-weight:700">${slotLogoHTML(m.a, 18)} ${slotName(m.a)}</span>
            <span style="color:var(--text-dim);font-size:11px">vs</span>
            <span style="display:flex;align-items:center;gap:5px;font-weight:700">${slotLogoHTML(m.b, 18)} ${slotName(m.b)}</span>
            <span class="post-meta" style="margin-left:auto">${m.status === "live" ? "LIVE" : fmtWhen(m.at)}</span>
          </a>`).join("") || `<div class="empty-note">예정된 경기가 없습니다</div>`;
    }

    renderBanner();
    renderFanPulse();
    renderDiscuss();
    renderDetails();
    renderRatingPanel();
    renderUpcoming();
    setupSidebarStandings();
    renderFooter();
  });
  </script>
</body>
</html>
