<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="다음 LCK 경기 승자를 무료로 예측하세요. 팬 참여 비율을 실시간으로 보고, 적중 기록이 팬 여권에 쌓입니다.">
  <link rel="canonical" href="https://lck-community.vercel.app/predict.html">
  <meta property="og:url" content="https://lck-community.vercel.app/predict.html">
  <meta property="og:site_name" content="The Nexus">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK 승부예측 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 승부예측 — The Nexus">
  <meta property="og:description" content="다음 LCK 경기 승자를 무료로 예측하세요. 팬 참여 비율을 실시간으로 보고, 적중 기록이 팬 여권에 쌓입니다.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260811b">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260811b">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260811b">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">승부예측 <span class="sub">무료 참여 · 적중 1건당 10포인트</span></h1>
      </div>

      <div class="stat-cards" id="stat-cards"></div>

      <div class="layout">
        <div class="stack">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title">예측 가능한 경기</h2>
              <span class="card-more">마감: 경기 시작 5분 전</span>
            </div>
            <div id="open-matches"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">지난 예측 결과</h2>
            </div>
            <div id="done-matches"></div>
          </section>
        </div>

        <aside class="stack">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title">주간 예측 랭킹</h2>
              <a class="card-more" href="ranking.html">전체 ›</a>
            </div>
            <div id="predict-ranking"></div>
          </section>

          <section class="card">
            <div class="card-head"><h2 class="card-title">예측 규칙</h2></div>
            <div class="admin-note" style="border-top:none">
              · 모든 예측은 무료입니다.<br>
              · 예측은 경기 시작 5분 전 마감됩니다.<br>
              · 포인트는 환전·양도할 수 없습니다.<br>
              · 마감 후 변경된 예측은 인정되지 않습니다.
            </div>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <script src="assets/data.js?v=20260811b"></script>
  <script src="assets/vendor/supabase.min.js?v=20260811b"></script>
  <script src="assets/store.js?v=20260811b"></script>
  <script src="assets/app.js?v=20260811b"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("승부예측", null);

    function renderStats() {
      const s = myPredictionStats();
      const rate = s.total ? Math.round((s.hit / s.total) * 100) : 0;
      document.getElementById("stat-cards").innerHTML = `
        <div class="stat-card"><div class="k">참여한 예측</div><div class="v">${s.total + s.pending}<span style="font-size:13px;color:var(--text-dim)"> 건</span></div></div>
        <div class="stat-card"><div class="k">적중</div><div class="v"><em>${s.hit}</em><span style="font-size:13px;color:var(--text-dim)"> 건</span></div></div>
        <div class="stat-card"><div class="k">적중률</div><div class="v">${rate}%</div></div>
        <div class="stat-card"><div class="k">내 포인트</div><div class="v">${s.points}<span style="font-size:13px;color:var(--text-dim)"> P</span></div></div>`;
    }

    function matchRowHTML(m, done) {
      const A = TEAM_MAP[m.a], B = TEAM_MAP[m.b];
      if (!A || !B) return "";
      const votes = getVotes();
      const my = votes[m.id];
      const pct = communityPct(m);

      if (done) {
        const winner = matchWinner(m);
        const result = !winner
          ? `<span style="color:var(--text-dim)">결과 확인 중</span>`
          : my
          ? (my === winner
            ? `<span class="hit">적중! +10P</span>`
            : `<span class="miss">빗나감</span>`)
          : `<span style="color:var(--text-dim)">미참여</span>`;
        return `
        <div class="predict-match">
          <div class="pm-result">${result}</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800">
            <span style="display:flex;align-items:center;gap:7px">${teamLogoHTML(A, 24)} ${A.abbr}</span>
            <span class="match-score" style="padding:3px 12px">${m.scoreA} : ${m.scoreB}</span>
            <span style="display:flex;align-items:center;gap:7px">${B.abbr} ${teamLogoHTML(B, 24)}</span>
          </div>
          <div class="pm-info" style="text-align:right">${fmtWhen(m.at)}</div>
        </div>`;
      }

      return `
      <div class="predict-match">
        <button class="pm-btn ${my === "a" ? "voted" : ""}" style="--team-color:${A.color}" data-match="${m.id}" data-side="a">
          ${teamLogoHTML(A, 24)} ${A.abbr} <span style="margin-left:auto;color:var(--text-sub)">${pct.n ? pct.a + "%" : ""}</span>
        </button>
        <div class="pm-info" style="text-align:center">
          <b>${fmtWhen(m.at)}</b><br>${esc(shortStage(m.stage))} · ${pct.n ? `${pct.n}명 참여` : "예측 대기 중"}
          ${my ? `<br><span style="color:var(--accent);font-weight:700">${my === "a" ? A.abbr : B.abbr} 승리 예측 중</span>
            <button type="button" class="pm-share" data-share="${esc(m.id)}" title="예측 카드 저장">📷</button>` : ""}
        </div>
        <button class="pm-btn right ${my === "b" ? "voted" : ""}" style="--team-color:${B.color}" data-match="${m.id}" data-side="b">
          ${teamLogoHTML(B, 24)} ${B.abbr} <span style="margin-right:auto;color:var(--text-sub)">${pct.n ? pct.b + "%" : ""}</span>
        </button>
      </div>`;
    }

    function renderMatches() {
      const ms = sortedMatches();
      // 마감 판정은 store.js predictOpen() 하나로 — 서버(vote_match)와 같은 규칙이라야
      // 누를 수 있는데 저장은 안 되는 일이 없다
      const open = ms.filter(predictOpen);
      const done = ms.filter(m => m.status === "done").reverse();
      const closed = ms.filter(m => m.status !== "done" && !predictOpen(m));

      document.getElementById("open-matches").innerHTML =
        (open.map(m => matchRowHTML(m, false)).join("")
          || `<div class="empty-note">예측 가능한 경기가 없습니다</div>`)
        + (closed.length ? `<div class="admin-note">진행 중이거나 곧 시작하는 경기 ${closed.length}건은 예측이 마감됐습니다.</div>` : "");
      document.getElementById("done-matches").innerHTML =
        done.map(m => matchRowHTML(m, true)).join("") || `<div class="empty-note">종료된 경기가 없습니다</div>`;

      document.querySelectorAll("[data-match]").forEach(b => b.addEventListener("click", () => {
        setVote(b.dataset.match, b.dataset.side);
        renderStats(); renderMatches();
      }));
    }

    renderStats();
    document.getElementById("open-matches")?.addEventListener("click", e => {
      const b = e.target.closest(".pm-share");
      if (!b) return;
      e.preventDefault();
      const m = getMatches().find(x => x.id === b.dataset.share);
      const my = getVotes()[b.dataset.share];
      if (m && my) sharePredictionCard(m, my);
    });

    renderMatches();
    renderPredictRanking();
    // 참여 비율·내 표는 서버 집계에서 오므로, 스냅샷으로 먼저 그렸다면 도착 후 다시 그린다
    storeFresh.then(() => { renderStats(); renderMatches(); renderPredictRanking(); }).catch(() => {});
    renderFooter();
  
  });
  </script>
</body>
</html>
