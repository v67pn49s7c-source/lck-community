<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 — LCK 라운지</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">글쓰기</h1>
        </div>
        <section class="card">
          <form class="write-form" id="write-form">
            <div class="row">
              <div>
                <div class="form-label">닉네임</div>
                <input id="write-nick" placeholder="닉네임" required maxlength="12" style="width:100%">
              </div>
              <div>
                <div class="form-label">게시판</div>
                <select id="write-team" style="width:100%"></select>
              </div>
              <div>
                <div class="form-label">분류</div>
                <select id="write-cat" style="width:100%"></select>
              </div>
            </div>
            <input id="write-title" placeholder="제목을 입력하세요" required maxlength="80">
            <textarea id="write-body" placeholder="내용을 입력하세요. 비방·혐오 표현, 불법 베팅·중계 링크는 제재됩니다." required></textarea>
            <div class="row" style="justify-content:flex-end; flex:0;">
              <a class="btn-secondary" href="community.html" style="text-align:center">취소</a>
              <button class="btn-primary" type="submit">등록</button>
            </div>
          </form>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위 <span class="sub">라운드 3-4</span></h2>
          </div>
          <div class="standing-tabs">
            <button data-group="legend" class="active">레전드 그룹</button>
            <button data-group="rise">라이즈 그룹</button>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/board.js"></script>
  <script>initWritePage();</script>
</body>
</html>
