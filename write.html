<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260808a">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260808a">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260808a">
</head>
<body>
  <main class="page">
    <div class="container layout">
      <div class="stack">
        <div class="page-title-row">
          <h1 class="page-title">글쓰기</h1>
        </div>
        <section class="card">
          <form class="write-form" id="write-form">
            <div class="row">
              <div>
                <div class="form-label">닉네임</div>
                <input id="write-nick" placeholder="닉네임" maxlength="12" style="width:100%" readonly>
              </div>
              <div>
                <div class="form-label">게시판</div>
                <select id="write-team" style="width:100%"></select>
              </div>
              <div>
                <div class="form-label">분류</div>
                <select id="write-cat" style="width:100%"></select>
              </div>
              <div id="write-pw-wrap">
                <div class="form-label">비밀번호</div>
                <input id="write-pw" type="password" placeholder="4자 이상" minlength="4" maxlength="20"
                  autocomplete="new-password" style="width:100%">
              </div>
            </div>
            <div class="form-hint" id="write-pw-hint">비밀번호는 이 글을 수정·삭제할 때 씁니다. 잊어버리면 되돌릴 수 없어요.</div>
            <input id="write-title" placeholder="제목을 입력하세요" required maxlength="80">
            <textarea id="write-body" placeholder="내용을 입력하세요. 비방·혐오 표현, 불법 베팅·중계 링크는 제재됩니다." required></textarea>

            <div id="poll-attach-wrap" style="display:none; border:1px solid var(--line); padding:12px; background:var(--bg-soft)">
              <label style="display:flex; gap:7px; align-items:center; font-weight:700; cursor:pointer">
                <input type="checkbox" id="poll-attach"> 이 글에 투표 붙이기 <span style="font-weight:400; color:var(--text-dim); font-size:12px">(질문 = 글 제목)</span>
              </label>
              <div id="poll-fields" style="display:none; margin-top:10px; display:none; flex-direction:column; gap:8px">
                <textarea id="poll-options" rows="4" placeholder="보기를 한 줄에 하나씩 입력 (2~10개)&#10;예:&#10;T1&#10;GEN"></textarea>
                <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap">
                  <label style="display:flex; gap:6px; align-items:center; cursor:pointer; font-size:13px">
                    <input type="checkbox" id="poll-multi"> 복수 선택 허용
                  </label>
                  <label style="display:flex; gap:6px; align-items:center; font-size:13px">
                    마감(선택·한국 시간): <input type="datetime-local" id="poll-closes" style="padding:4px 8px">
                  </label>
                </div>
              </div>
            </div>
            <div class="row" style="justify-content:flex-end; flex:0;">
              <a class="btn-secondary" href="community.html" style="text-align:center">취소</a>
              <button class="btn-primary" type="submit">등록</button>
            </div>
          </form>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">다음 경기 예측</h2>
            <span class="card-more" id="predict-when"></span>
          </div>
          <div class="predict-widget" id="predict-widget"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260808a"></script>
  <script src="assets/vendor/supabase.min.js?v=20260808a"></script>
  <script src="assets/store.js?v=20260808a"></script>
  <script src="assets/app.js?v=20260808a"></script>
  <script src="assets/board.js?v=20260808a"></script>
  <script>initWritePage();</script>
</body>
</html>
