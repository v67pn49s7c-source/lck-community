<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">선수 <span class="sub">2026 LCK 로스터 · 카드를 누르면 선수 응원 페이지로</span></h1>
      </div>
      <div id="rosters"></div>
    </div>
  </main>

  <script src="assets/data.js?v=20260808d"></script>
  <script src="assets/vendor/supabase.min.js?v=20260808d"></script>
  <script src="assets/store.js?v=20260808d"></script>
  <script src="assets/app.js?v=20260808d"></script>
  <script src="assets/player-photos.js?v=20260808d"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("선수", null);

    function drawRosters() {
    document.getElementById("rosters").innerHTML = TEAMS.map(t => {
      const players = teamPlayers(t.id);
      if (!players.length) return "";
      return `
      <section class="card" style="margin-bottom:14px">
        <div class="card-head">
          <h2 class="card-title">${t.name} <span class="sub team-text" style="--team-color:${t.color}">${t.abbr}</span></h2>
          <a class="card-more" href="team.html?team=${t.id}">팀 게시판 ›</a>
        </div>
        <div class="team-grid" style="padding:14px">
          ${players.map(p => {
            const c = latestMatchRating(p.id);
            return `
            <a class="team-card" style="--team-color:${t.color}" href="player.html?id=${q(p.id)}">
              ${playerAvatarHTML(p, t.color, false)}
              <div style="text-align:center">
                <div class="tc-abbr">${esc(p.pos)}</div>
                <div class="tc-name">${esc(p.nick)}</div>
                <div class="tc-record">${esc(p.name)}</div>
                <div class="tc-record">${c ? "최근 경기 " + c.avg + "점 (" + c.n + "명)" : "평점 없음"}</div>
              </div>
            </a>`;
          }).join("")}
        </div>
      </section>`;
    }).join("");
    }
    drawRosters();
    // 저장된 사본으로 먼저 그리고, 서버 자료가 도착하면 한 번 더 그린다.
    // 이게 없으면 다시 찾아온 사람은 늘 '지난번 자료'를 본다. (2026-08-07)
    storeFresh.then(drawRosters).catch(() => {});

    renderFooter();
  
  });
  </script>
</body>
