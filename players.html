<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선수 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260805i">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">선수 <span class="sub">2026 LCK 로스터 · 카드를 누르면 선수 응원 페이지로</span></h1>
      </div>
      <div id="rosters"></div>
    </div>
  </main>

  <script src="assets/data.js?v=20260805i"></script>
  <script src="assets/vendor/supabase.min.js?v=20260805i"></script>
  <script src="assets/store.js?v=20260805i"></script>
  <script src="assets/app.js?v=20260805i"></script>
  <script src="assets/player-photos.js?v=20260805i"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("선수", null);

    document.getElementById("rosters").innerHTML = TEAMS.map(t => {
      const players = teamPlayers(t.id);
      if (!players.length) return "";
      return `
      <section class="card" style="margin-bottom:14px">
        <div class="card-head">
          <h2 class="card-title">${t.name} <span class="sub" style="color:${t.color}">${t.abbr}</span></h2>
          <a class="card-more" href="team.html?team=${t.id}">팀 게시판 ›</a>
        </div>
        <div class="team-grid" style="padding:14px">
          ${players.map(p => {
            const c = latestMatchRating(p.id);
            return `
            <a class="team-card" style="--team-color:${t.color}" href="player.html?id=${q(p.id)}">
              ${playerAvatarHTML(p, t.color, false)}
              <div style="text-align:center">
                <div class="tc-abbr">${esc(p.pos)}</div>
                <div class="tc-name">${esc(p.nick)}</div>
                <div class="tc-record">${esc(p.name)}</div>
                <div class="tc-record">${c ? "최근 경기 " + c.avg + "점 (" + c.n + "명)" : "평점 없음"}</div>
              </div>
            </a>`;
          }).join("")}
        </div>
      </section>`;
    }).join("");

    renderFooter();
  
  });
  </script>
</body>
</html>
