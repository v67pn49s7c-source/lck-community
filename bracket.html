<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="LCK 토너먼트 대진표. 라운드별 승자와 다음 상대를 한눈에.">
  <link rel="canonical" href="https://lck-community.vercel.app/bracket.html">
  <meta property="og:url" content="https://lck-community.vercel.app/bracket.html">
  <meta property="og:site_name" content="The Nexus">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK 대진표 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 대진표 — The Nexus">
  <meta property="og:description" content="LCK 토너먼트 대진표. 라운드별 승자와 다음 상대를 한눈에.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260808j">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260808j">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260808j">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">대진표 <span class="sub" id="bracket-sub"></span></h1>
        <div style="display:flex; gap:8px; align-items:center">
          <select id="tournament-select" style="min-width:200px"></select>
          <a class="btn-secondary" href="matches.html">일정으로</a>
        </div>
      </div>

      <section class="card">
        <div class="bracket-wrap">
          <div class="bracket" id="bracket-body"></div>
        </div>
        <div class="bracket-legend" id="bracket-legend"></div>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260808j"></script>
  <script src="assets/vendor/supabase.min.js?v=20260808j"></script>
  <script src="assets/store.js?v=20260808j"></script>
  <script src="assets/app.js?v=20260808j"></script>
  <script src="assets/brackets.js?v=20260808j"></script>
  <script>
  storeReady.then(async () => {
    renderHeader("경기", null);

    const state = { tid: new URLSearchParams(location.search).get("t") };
    const LEGEND_DEFAULT = `색이 있는 칸 = 이긴 팀 ·
      <span style="color:var(--text-dim)">회색 점선 로고 = 아직 정해지지 않은 자리</span>
      · 경기 칸을 누르면 그 경기 페이지로 갑니다`;

    // 아직 대회를 안 만들었어도 대진표는 미리 볼 수 있어야 한다.
    // 팬은 "우리 팀이 여기서 이기면 어디로 가는지"를 경기 전에 궁금해한다.
    // 선언만 있고 대회가 없는 것은 '예정' 으로 목록에 끼워 넣는다. (2026-08-07)
    const PLANNED = [
      { id: "lck2026-playin",    name: "2026 LCK 플레이-인 (8/26~28)" },
      { id: "lck2026-playoffs",  name: "2026 LCK 플레이오프 (8/29~9/13)" },
    ];
    function allTournaments() {
      const ts = getTournaments();
      const have = new Set(ts.map(t => t.id));
      return ts.concat(PLANNED.filter(p => !have.has(p.id) && BRACKETS[p.id])
        .map(p => ({ ...p, type: "토너먼트", stages: [], planned: true })));
    }

    function renderSelect() {
      const ts = allTournaments();
      const sel = document.getElementById("tournament-select");
      if (!ts.length) { sel.innerHTML = `<option>등록된 대회 없음</option>`; return; }
      // ⚠ 예전에는 무조건 마지막 대회를 골랐다. 그게 라운드 구분이 없는 대회면
      //   화면이 통째로 비어 버린다(실제로 그랬다). 대진이 있는 대회를 먼저 고른다.
      if (!ts.find(t => t.id === state.tid)) {
        const withStages = ts.filter(t => (t.stages || []).length);
        state.tid = (withStages.length ? withStages : ts).slice(-1)[0].id;
      }
      sel.innerHTML = ts.map(t => `<option value="${t.id}" ${t.id === state.tid ? "selected" : ""}>${esc(t.name)}</option>`).join("");
      sel.onchange = () => { state.tid = sel.value; renderBracket(); };
    }

    function bmSlotHTML(m, side) {
      const v = side === "a" ? m.a : m.b;
      const myScore = side === "a" ? m.scoreA : m.scoreB;
      const otherScore = side === "a" ? m.scoreB : m.scoreA;
      const done = m.status === "done";
      const win = done && myScore != null && otherScore != null && myScore > otherScore;
      const lose = done && myScore != null && otherScore != null && myScore < otherScore;
      return `
      <div class="bm-slot ${isRealTeam(v) ? "" : "tbd"} ${win ? "winner" : ""} ${lose ? "loser" : ""}">
        ${slotLogoHTML(v, 22)}
        <span>${slotName(v)}</span>
        <span class="score">${(done || m.status === "live") && myScore != null ? myScore : ""}</span>
      </div>`;
    }

    function fmtShortDate(iso) {
      const d = new Date(iso);
      return new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric" }).format(d);
    }

    function renderBracket() {
      const t = allTournaments().find(x => x.id === state.tid);
      const el = document.getElementById("bracket-body");
      document.getElementById("bracket-sub").textContent = t ? `${t.name} · ${t.type}` : "";
      if (!t) { el.innerHTML = `<div class="empty-note">대회를 먼저 만들어 주세요 (관리자 메뉴)</div>`; return; }

      const ms = sortedMatches().filter(m => m.tid === t.id);

      // ① 대진 모양이 선언된 대회(Road to MSI·플레이-인·플레이오프)는 진짜 대진표로 그린다
      const spec = bracketOf(t.id);
      const legendEl = document.getElementById("bracket-legend");
      if (spec) {
        el.innerHTML = bracketHTML(spec);
        legendEl.innerHTML = (t.planned
          ? `<b style="color:var(--accent)">아직 시작 전입니다</b> — 각 자리에 누가 올지 규칙만 보여 드립니다. `
          : "") + bracketLegendHTML(spec);
        return;
      }
      legendEl.innerHTML = LEGEND_DEFAULT;

      // ② 라운드가 나뉘지 않은 대회(정규시즌 등)는 대진표로 그릴 게 없다.
      // 빈 화면 대신 지금 볼 수 있는 곳으로 보낸다.
      if (!(t.stages || []).length) {
        el.innerHTML = `<div class="empty-note" style="padding:28px 16px">
          <b>${esc(t.name)}</b>은 아직 대진이 나뉘지 않았습니다.<br>
          플레이오프 대진이 확정되면 여기에 표시됩니다.
          <div style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap">
            <a class="btn-primary" href="race.html" style="text-decoration:none">경우의 수 보기</a>
            <a class="btn-secondary" href="standings.html" style="text-decoration:none">순위표</a>
            <a class="btn-secondary" href="matches.html" style="text-decoration:none">경기 일정</a>
          </div></div>`;
        return;
      }
      el.innerHTML = t.stages.map(stage => {
        const list = ms.filter(m => m.stage === stage);
        return `
        <div class="bracket-col">
          <div class="bracket-col-title">${esc(stage)}</div>
          <div class="bracket-col-body">
            ${list.map(m => `
              <a class="bracket-match" href="/match/${q(m.id)}">
                <div class="bm-head">
                  <span>${esc(m.label || `${slotName(m.a)} vs ${slotName(m.b)}`)}</span>
                  <span class="bm-date">${fmtShortDate(m.at)}${m.status === "live" ? " · LIVE" : ""}</span>
                </div>
                ${bmSlotHTML(m, "a")}
                ${bmSlotHTML(m, "b")}
              </a>`).join("") || `<div class="empty-note" style="padding:14px">경기 없음</div>`}
          </div>
        </div>`;
      }).join("");
    }

    renderSelect();
    renderBracket();

    // 저장된 사본으로 먼저 그리고, 서버 자료가 도착하면 **한 번 더** 그린다.
    // 이게 없으면 다시 찾아온 사람은 늘 '지난번 자료'를 본다 — 경기가 끝나도
    // 순위·스코어가 그대로고, 이름을 바꿔도 옛 이름이 남는다. (2026-08-07)
    storeFresh.then(() => { renderSelect(); renderBracket(); }).catch(() => {});
    renderFooter();
  
  });
  </script>
</body>
</html>
