<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="LCK 정규시즌 경우의 수 — 남은 경기 승패 조합을 전부 계산해 각 팀의 자력 확보선과 산술 가능선을 매일 갱신합니다.">
  <link rel="canonical" href="https://lck-community.vercel.app/race.html">
  <meta property="og:url" content="https://lck-community.vercel.app/race.html">
  <meta property="og:site_name" content="The Nexus">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK 경우의 수 — 플레이오프 레이스 | The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 경우의 수 — 플레이오프 레이스">
  <meta property="og:description" content="남은 경기 승패 조합 전수 계산 — 우리 팀은 몇 승이 더 필요한가. 매일 갱신.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/nexus-mobile.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260807h">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">경우의 수 <span class="sub">남은 경기 전수 계산 · 매일 갱신</span></h1>
      </div>

      <!-- 검색 로봇도 읽을 수 있는 정적 설명 (데이터 표는 아래에 그려진다) -->
      <section class="card">
        <div class="card-head">
          <h2 class="card-title">우리 팀은 몇 승이 더 필요한가</h2>
          <span class="card-more" id="race-updated"></span>
        </div>
        <div class="admin-note" style="border-top:none">
          LCK 정규시즌 남은 경기의 승패 조합을 <b>전부 계산</b>해서(수만 가지),
          각 팀이 목표 순위를 지키는 데 필요한 승수를 보여 줍니다.<br>
          · <b>자력 확보선</b> — 다른 경기 결과와 <b>무관하게</b> 그 순위 안이 보장되는 최소 승수.
          승수 동률조차 걸치지 않는 경우만 인정합니다.<br>
          · <b>산술 가능선</b> — 다른 경기 결과가 전부 따라줄 때의 최소 승수.<br>
          · 승수가 같아지는 조합은 <b>세트 득실(규정)</b>로 갈리므로, 그 비율을 그대로 밝힙니다.
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title" id="race-title">레이스</h2>
          <span class="card-more">
            <button class="card-more" id="race-copy" style="font-weight:700" title="커뮤니티에 그대로 붙일 수 있는 텍스트 표">📋 표 복사</button>
          </span>
        </div>
        <div class="filter-tabs" id="race-tabs" style="padding:10px 16px 0"></div>
        <div id="race-body"></div>
      </section>

      <section class="card" id="race-next-card" style="display:none">
        <div class="card-head"><h2 class="card-title">다음 경기의 의미</h2></div>
        <div id="race-next"></div>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260807h"></script>
  <script src="assets/vendor/supabase.min.js?v=20260807h"></script>
  <script src="assets/store.js?v=20260807h"></script>
  <script src="assets/app.js?v=20260807h"></script>
  <script src="assets/race.js?v=20260807h"></script>
  <script>
  storeReady.then(() => {
    renderHeader("경우의 수", null);

    // SNS 딥링크: race.html?team=kt 로 들어오면 그 팀 그룹을 바로 펼치고 줄을 강조한다
    // (인스타에서 온 사람이 팀 고르기부터 다시 하지 않게 — 첫 댓글 링크용)
    const deepTeam = new URLSearchParams(location.search).get("team");
    let tab = "r34L";
    if (deepTeam) {
      const home = Object.keys(RACE_CUTS).find(id =>
        (Cache.records.find(s => s.id === id)?.records || []).some(r => r.team === deepTeam));
      if (home) tab = home;
    }
    const TABS = [["r34L", "레전드 그룹"], ["r34R", "라이즈 그룹"]];

    function cellHTML(row, c) {
      // 자력(크게) + 산술(작게). "확보/불가"는 말로.
      const safe = c.safe == null
        ? `<b style="color:var(--text-dim)">자력 불가</b>`
        : c.safe === 0 ? `<b style="color:var(--ok,#2fbf71)">확보</b>`
        : c.safe === row.remaining ? `<b>전승 (${c.safe}승)</b>`
        : `<b>${c.safe}승</b>`;
      const hope = c.hope == null ? "산술상 불가"
        : c.hope === 0 ? "산술 확보" : `산술 ${c.hope}승`;
      return `<td style="text-align:center">${safe}<br><span style="font-size:12px;color:var(--text-dim)">${hope}</span></td>`;
    }

    function render() {
      const r = raceFromCache(tab);
      document.getElementById("race-tabs").innerHTML = TABS.map(([id, name]) =>
        `<button class="${id === tab ? "active" : ""}" data-tab="${id}">${name}</button>`).join("");
      document.querySelectorAll("#race-tabs [data-tab]").forEach(b =>
        b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));

      const body = document.getElementById("race-body");
      if (!r) { body.innerHTML = `<div class="empty-note">아직 계산할 경기가 없습니다</div>`; return; }

      document.getElementById("race-title").textContent = r.stageName;
      document.getElementById("race-updated").textContent =
        `잔여 ${r.remainCount}경기 · ${r.scenarioCount.toLocaleString()}가지 조합`;

      body.innerHTML = `
        <div style="overflow-x:auto">
        <table class="standings" style="min-width:560px">
          <thead><tr>
            <th>#</th><th style="text-align:left">팀</th><th>전적</th><th>득실</th><th>잔여</th>
            ${r.cuts.map(c => `<th style="text-align:center">${esc(c.label)}<br><span style="font-weight:400;font-size:11px;color:var(--text-dim)">자력 · 산술</span></th>`).join("")}
          </tr></thead>
          <tbody>
            ${r.rows.map((row, i) => {
              const t = TEAM_MAP[row.team];
              return `<tr${row.team === deepTeam ? ` style="background:color-mix(in srgb, ${t.color} 12%, transparent)"` : ""}>
                <td>${i + 1}</td>
                <td style="text-align:left"><span style="display:inline-flex;align-items:center;gap:7px">${teamLogoHTML(t, 20)} <b>${esc(t.abbr)}</b></span></td>
                <td>${row.w}승 ${row.l}패</td>
                <td>${row.pt > 0 ? "+" : ""}${row.pt}</td>
                <td>${row.remaining}</td>
                ${row.cuts.map(c => cellHTML(row, c)).join("")}
              </tr>`;
            }).join("")}
          </tbody>
        </table>
        </div>
        <div class="admin-note">
          ${r.cuts.map((c, i) => `승패 조합의 <b>${r.tiePct[i]}%</b>는 <b>${esc(c.label)}</b> 경계가 승수 동률입니다 —
            그 경우 순위는 세트 득실(규정)로 갈리며, 여기서는 단정하지 않습니다.`).join("<br>")}<br>
          계산은 실제 경기 기록(Leaguepedia 기준·자동 수집)에서 바로 나오며 매일 갱신됩니다.
        </div>`;

      renderNext(r);
    }

    // 다음 예정 경기 하나 — 이기면/지면 자력선이 어떻게 변하는가
    function renderNext(r) {
      const card = document.getElementById("race-next-card");
      const next = r.remain.slice().filter(m => m.at)
        .sort((a, b) => new Date(a.at) - new Date(b.at))[0];
      if (!next) { card.style.display = "none"; return; }
      card.style.display = "";
      const A = TEAM_MAP[next.a], B = TEAM_MAP[next.b];
      const ci = 0; // 첫 번째 컷 기준 (레전드: 2위 안 · 라이즈: 3위 안)
      const cutLabel = r.cuts[ci].label;

      const base = Object.fromEntries(r.rows.map(x => [x.team, x.cuts[ci].safe]));
      const ifA = raceWhatIf(tab, next.id, "a"), ifB = raceWhatIf(tab, next.id, "b");
      const safeOf = (res, t) => res && res.rows.find(x => x.team === t)?.cuts[ci].safe;

      const lineFor = (t, win, lose) => {
        const b = base[t.id], w = safeOf(win, t.id), l = safeOf(lose, t.id);
        const f = v => v == null ? "자력 불가" : v === 0 ? "확보" : `자력 ${v}승`;
        if (b == null && w == null && l == null) return "";
        return `<b style="color:${t.color}">${esc(t.abbr)}</b> — 이기면 ${f(w)} · 지면 ${f(l)} <span style="color:var(--text-dim)">(지금 ${f(b)})</span>`;
      };
      document.getElementById("race-next").innerHTML = `
        <div class="admin-note" style="border-top:none">
          <b>${esc(A.abbr)} vs ${esc(B.abbr)}</b> · ${esc(fmtWhen(next.at))} — <b>${esc(cutLabel)}</b> 기준<br>
          ${lineFor(A, ifA, ifB)}<br>
          ${lineFor(B, ifB, ifA)}
        </div>`;
    }

    document.getElementById("race-copy").addEventListener("click", async () => {
      const btn = document.getElementById("race-copy");
      try {
        await navigator.clipboard.writeText(raceCopyText(tab));
        btn.textContent = "✓ 복사됨 — 그대로 붙여넣기";
      } catch { btn.textContent = "복사 실패 — 다시 눌러 주세요"; }
      setTimeout(() => { btn.textContent = "📋 표 복사"; }, 2500);
    });

    render();
    storeFresh.then(() => render()).catch(() => {});
    renderFooter();
  });
  </script>
</body>
</html>
