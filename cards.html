<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 스튜디오 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260812a">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260812a">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260812a">
  <style>
    .studio-preview { display:flex; justify-content:center; padding:16px;
      background:var(--bg); border-radius:10px; }
    .studio-preview canvas { width:100%; max-width:520px; height:auto;
      border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
    .studio-opts { display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 0; }
    .studio-actions { display:flex; gap:8px; padding:14px 16px; flex-wrap:wrap; }
    .studio-caption { margin:0 16px 16px; padding:12px 14px; background:var(--bg);
      border:1px solid var(--line); border-radius:8px; font-size:13.5px;
      white-space:pre-wrap; color:var(--text-sub); }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">카드 스튜디오 <span class="sub">보고 → 저장 → 직접 올리기 (자동 발행 없음)</span></h1>
      </div>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">발행 대기함</h2>
          <span class="card-more" id="studio-note"></span>
        </div>
        <div class="filter-tabs" id="studio-tabs" style="padding:12px 16px 0"></div>
        <div class="studio-opts" id="studio-opts"></div>
        <div class="studio-opts" id="studio-headline-wrap" style="display:none">
          <input id="studio-headline" placeholder="헤드라인 직접 쓰기 (비우면 자동) — 예: 리그 1위의 품격"
            style="width:100%;max-width:520px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px">
        </div>
        <div class="studio-preview" id="studio-slides" style="flex-direction:column;gap:14px;align-items:center"></div>
        <div class="studio-actions">
          <button class="btn-secondary" id="studio-copy">📋 캡션 복사</button>
          <button class="btn-secondary" id="studio-copy2">📋 첫 댓글(링크) 복사</button>
        </div>
        <div class="studio-caption" id="studio-caption"></div>
        <div class="admin-note">
          발행 규칙 — <b>본문에는 링크를 넣지 않습니다</b>(도달이 깎입니다). 링크는 <b>첫 댓글</b>에.
          해시태그는 1~2개까지. 팀 로고·선수 사진은 카드에 넣지 않습니다(상표·초상권).
          숫자는 여는 순간 다시 계산되므로, <b>저장 직전에 새로고침</b>하면 항상 최신입니다.
        </div>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260812a"></script>
  <script src="assets/vendor/supabase.min.js?v=20260812a"></script>
  <script src="assets/store.js?v=20260812a"></script>
  <script src="assets/app.js?v=20260812a"></script>
  <script src="assets/race.js?v=20260812a"></script>
  <script src="assets/cards.js?v=20260812a"></script>
  <script>
  // 인증 상태가 확정된 뒤에 게이트를 판정해야 하므로 storeFresh 를 기다린다 (admin.html 과 동일)
  storeFresh.then(() => {
    renderHeader(null, null);

    // ── 운영자 전용 게이트 ──
    // 카드에 THE NEXUS 브랜드와 임의 헤드라인이 들어가므로, 아무나 만들 수 있으면
    // 사칭 발행물 제작 도구가 된다. 화면 게이트 + 관리자 계정으로만 연다 (2026-08-07).
    if (!Auth.profile?.is_admin) {
      document.querySelector("main .container").innerHTML = `
        <div class="page-title-row"><h1 class="page-title">운영자 전용</h1></div>
        <section class="card"><div class="admin-note" style="border-top:none">
          카드 스튜디오는 공식 SNS 발행물을 만드는 운영 도구라 관리자만 쓸 수 있습니다.<br>
          <a href="admin.html" style="text-decoration:underline">관리자 로그인 →</a> ·
          <a href="index.html" style="text-decoration:underline">홈으로</a>
        </div></section>`;
      renderFooter();
      return;
    }

    const TABS = [
      ["result", "결과 캐러셀"],
      ["founding", "창립 팬 레이스"],
      ["race", "생존표"],
      ["number", "LCK 넘버"],
      ["matchday", "매치데이"],
    ];
    let tab = "result";
    let opt = null;          // 탭별 세부 선택 (그룹·후보·경기)
    let current = null;      // { slides: [canvas…], caption, firstComment }

    function optionsFor() {
      if (tab === "result")
        return Cache.matches.filter(m => m.status === "done" && TEAM_MAP[m.a] && TEAM_MAP[m.b]
            && m.scoreA != null && m.scoreA !== m.scoreB)
          .sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 8)
          .map(m => [m.id, `${TEAM_MAP[m.a].abbr} ${m.scoreA}:${m.scoreB} ${TEAM_MAP[m.b].abbr} · ${fmtMD(m.at)}`]);
      if (tab === "race") return [["r34L", "레전드"], ["r34R", "라이즈"]];
      if (tab === "number")
        return numberCandidates().map((cand, i) => [String(i), `${cand.num} · ${cand.fact.slice(0, 22)}…`]);
      if (tab === "matchday")
        return Cache.matches.filter(m => m.status !== "done" && TEAM_MAP[m.a] && TEAM_MAP[m.b] && m.at)
          .sort((a, b) => new Date(a.at) - new Date(b.at)).slice(0, 8)
          .map(m => [m.id, `${TEAM_MAP[m.a].abbr} vs ${TEAM_MAP[m.b].abbr} · ${fmtMD(m.at)}`]);
      return [];
    }

    function render() {
      document.getElementById("studio-tabs").innerHTML = TABS.map(([id, name]) =>
        `<button class="${id === tab ? "active" : ""}" data-tab="${id}">${name}</button>`).join("");
      document.querySelectorAll("#studio-tabs [data-tab]").forEach(b =>
        b.addEventListener("click", () => { tab = b.dataset.tab; opt = null; render(); }));

      const opts = optionsFor();
      if (opts.length && (opt == null || !opts.some(([id]) => id === opt))) opt = opts[0][0];
      document.getElementById("studio-opts").innerHTML = opts.map(([id, name]) =>
        `<button class="filter-tabs" style="all:unset"><span class="chip-stage" data-opt="${id}"
           style="cursor:pointer;${id === opt ? "outline:2px solid var(--accent)" : ""}">${name}</span></button>`).join("");
      document.querySelectorAll("#studio-opts [data-opt]").forEach(b =>
        b.addEventListener("click", () => { opt = b.dataset.opt; render(); }));

      // 헤드라인 입력은 결과 캐러셀에서만
      document.getElementById("studio-headline-wrap").style.display = tab === "result" ? "" : "none";
      const headline = document.getElementById("studio-headline").value;

      // 카드 그리기 — 어떤 탭이든 slides 배열로 통일 (캐러셀은 여러 장)
      const one = x => x && { ...x, slides: [x.c] };
      current =
        tab === "result" ? drawResultCarousel(opt, headline)
        : tab === "founding" ? one(drawFoundingCard())
        : tab === "race" ? one(drawRaceCard(opt))
        : tab === "number" ? (numberCandidates()[Number(opt)] ? one(drawNumberCard(numberCandidates()[Number(opt)])) : null)
        : tab === "matchday" ? one(drawMatchdayCard(opt))
        : null;

      const box = document.getElementById("studio-slides");
      const note = document.getElementById("studio-note");
      const cap = document.getElementById("studio-caption");
      if (!current || !current.slides.length) {
        box.innerHTML = `<div class="empty-note">만들 재료가 아직 없습니다</div>`;
        note.textContent = "";
        cap.textContent = "";
        return;
      }
      note.textContent = `1080×1080 · 인스타 1:1${current.slides.length > 1 ? ` · 캐러셀 ${current.slides.length}장` : ""}`;
      box.innerHTML = "";
      current.slides.forEach((cv, i) => {
        cv.style.cssText = "width:100%;max-width:520px;height:auto;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.35)";
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:flex;flex-direction:column;gap:8px;align-items:center;width:100%";
        wrap.appendChild(cv);
        const btn = document.createElement("button");
        btn.className = "btn-primary";
        btn.textContent = current.slides.length > 1 ? `⬇ ${i + 1}장 저장` : "⬇ PNG 저장";
        btn.addEventListener("click", () =>
          cardSave(cv, `nexus-${tab}-${new Date().toISOString().slice(0, 10)}-${i + 1}.png`));
        wrap.appendChild(btn);
        box.appendChild(wrap);
      });
      cap.textContent = `[캡션]\n${current.caption}\n\n[첫 댓글]\n${current.firstComment}`;
    }

    document.getElementById("studio-headline").addEventListener("input", () => {
      clearTimeout(window.__hlT);
      window.__hlT = setTimeout(render, 300);   // 타이핑 멈추면 다시 그리기
    });
    const copyBtn = (id, pick) => document.getElementById(id).addEventListener("click", async e => {
      if (!current) return;
      try { await navigator.clipboard.writeText(pick()); e.target.textContent = "✓ 복사됨"; }
      catch { e.target.textContent = "복사 실패"; }
      setTimeout(() => { e.target.textContent = id === "studio-copy" ? "📋 캡션 복사" : "📋 첫 댓글(링크) 복사"; }, 2000);
    });
    copyBtn("studio-copy", () => current.caption);
    copyBtn("studio-copy2", () => current.firstComment);

    render();
    storeFresh.then(() => render()).catch(() => {});
    renderFooter();
  });
  </script>
</body>
</html>
