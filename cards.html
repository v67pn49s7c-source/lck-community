<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 스튜디오 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <link rel="icon" type="image/png" href="assets/brand/nexus-mobile.png">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260807b">
  <style>
    .studio-preview { display:flex; justify-content:center; padding:16px;
      background:var(--bg); border-radius:10px; }
    .studio-preview canvas { width:100%; max-width:520px; height:auto;
      border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
    .studio-opts { display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 0; }
    .studio-actions { display:flex; gap:8px; padding:14px 16px; flex-wrap:wrap; }
    .studio-caption { margin:0 16px 16px; padding:12px 14px; background:var(--bg);
      border:1px solid var(--line); border-radius:8px; font-size:13.5px;
      white-space:pre-wrap; color:var(--text-sub); }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="page-title-row">
        <h1 class="page-title">카드 스튜디오 <span class="sub">보고 → 저장 → 직접 올리기 (자동 발행 없음)</span></h1>
      </div>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">발행 대기함</h2>
          <span class="card-more" id="studio-note"></span>
        </div>
        <div class="filter-tabs" id="studio-tabs" style="padding:12px 16px 0"></div>
        <div class="studio-opts" id="studio-opts"></div>
        <div class="studio-preview"><canvas id="studio-canvas" width="1080" height="1080"></canvas></div>
        <div class="studio-actions">
          <button class="btn-primary" id="studio-save">⬇ PNG 저장</button>
          <button class="btn-secondary" id="studio-copy">📋 캡션 복사</button>
          <button class="btn-secondary" id="studio-copy2">📋 첫 댓글(링크) 복사</button>
        </div>
        <div class="studio-caption" id="studio-caption"></div>
        <div class="admin-note">
          발행 규칙 — <b>본문에는 링크를 넣지 않습니다</b>(도달이 깎입니다). 링크는 <b>첫 댓글</b>에.
          해시태그는 1~2개까지. 팀 로고·선수 사진은 카드에 넣지 않습니다(상표·초상권).
          숫자는 여는 순간 다시 계산되므로, <b>저장 직전에 새로고침</b>하면 항상 최신입니다.
        </div>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260807b"></script>
  <script src="assets/vendor/supabase.min.js?v=20260807b"></script>
  <script src="assets/store.js?v=20260807b"></script>
  <script src="assets/app.js?v=20260807b"></script>
  <script src="assets/race.js?v=20260807b"></script>
  <script src="assets/cards.js?v=20260807b"></script>
  <script>
  storeReady.then(() => {
    renderHeader(null, null);

    const TABS = [
      ["founding", "창립 팬 레이스"],
      ["race", "생존표"],
      ["number", "LCK 넘버"],
      ["matchday", "매치데이"],
    ];
    let tab = "founding";
    let opt = null;          // 탭별 세부 선택 (그룹·후보·경기)
    let current = null;      // { c, caption, firstComment }

    function optionsFor() {
      if (tab === "race") return [["r34L", "레전드"], ["r34R", "라이즈"]];
      if (tab === "number")
        return numberCandidates().map((cand, i) => [String(i), `${cand.num} · ${cand.fact.slice(0, 22)}…`]);
      if (tab === "matchday")
        return Cache.matches.filter(m => m.status !== "done" && TEAM_MAP[m.a] && TEAM_MAP[m.b] && m.at)
          .sort((a, b) => new Date(a.at) - new Date(b.at)).slice(0, 8)
          .map(m => [m.id, `${TEAM_MAP[m.a].abbr} vs ${TEAM_MAP[m.b].abbr} · ${fmtMD(m.at)}`]);
      return [];
    }

    function render() {
      document.getElementById("studio-tabs").innerHTML = TABS.map(([id, name]) =>
        `<button class="${id === tab ? "active" : ""}" data-tab="${id}">${name}</button>`).join("");
      document.querySelectorAll("#studio-tabs [data-tab]").forEach(b =>
        b.addEventListener("click", () => { tab = b.dataset.tab; opt = null; render(); }));

      const opts = optionsFor();
      if (opts.length && (opt == null || !opts.some(([id]) => id === opt))) opt = opts[0][0];
      document.getElementById("studio-opts").innerHTML = opts.map(([id, name]) =>
        `<button class="filter-tabs" style="all:unset"><span class="chip-stage" data-opt="${id}"
           style="cursor:pointer;${id === opt ? "outline:2px solid var(--accent)" : ""}">${name}</span></button>`).join("");
      document.querySelectorAll("#studio-opts [data-opt]").forEach(b =>
        b.addEventListener("click", () => { opt = b.dataset.opt; render(); }));

      // 카드 그리기
      current =
        tab === "founding" ? drawFoundingCard()
        : tab === "race" ? drawRaceCard(opt)
        : tab === "number" ? (numberCandidates()[Number(opt)] ? drawNumberCard(numberCandidates()[Number(opt)]) : null)
        : tab === "matchday" ? drawMatchdayCard(opt)
        : null;

      const cv = document.getElementById("studio-canvas");
      const note = document.getElementById("studio-note");
      const cap = document.getElementById("studio-caption");
      if (!current) {
        cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
        note.textContent = "만들 재료가 아직 없습니다";
        cap.textContent = "";
        return;
      }
      note.textContent = "1080×1080 · 인스타 1:1";
      cv.getContext("2d").drawImage(current.c, 0, 0);
      cap.textContent = `[캡션]\n${current.caption}\n\n[첫 댓글]\n${current.firstComment}`;
    }

    document.getElementById("studio-save").addEventListener("click", () => {
      if (current) cardSave(current.c, `nexus-${tab}-${new Date().toISOString().slice(0, 10)}.png`);
    });
    const copyBtn = (id, pick) => document.getElementById(id).addEventListener("click", async e => {
      if (!current) return;
      try { await navigator.clipboard.writeText(pick()); e.target.textContent = "✓ 복사됨"; }
      catch { e.target.textContent = "복사 실패"; }
      setTimeout(() => { e.target.textContent = id === "studio-copy" ? "📋 캡션 복사" : "📋 첫 댓글(링크) 복사"; }, 2000);
    });
    copyBtn("studio-copy", () => current.caption);
    copyBtn("studio-copy2", () => current.firstComment);

    render();
    storeFresh.then(() => render()).catch(() => {});
    renderFooter();
  });
  </script>
</body>
</html>
