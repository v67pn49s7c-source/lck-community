<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="The Nexus — LCK 팬 커뮤니티">
  <meta property="og:description" content="경기마다 팬심지수 투표! 전체·양 팀 팬·중립의 여론을 비교해 보세요.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260807u">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260807u">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260807u">
</head>
<body>
  <main class="page">
    <div class="container" style="max-width:440px">
      <div class="page-title-row">
        <h1 class="page-title" id="auth-title">로그인</h1>
      </div>

      <section class="card">
        <div class="board-toolbar">
          <div class="filter-tabs">
            <button id="tab-login" class="active">로그인</button>
            <button id="tab-signup">회원가입</button>
          </div>
        </div>

        <form class="write-form" id="auth-form">
          <div id="nick-field" style="display:none">
            <div class="form-label">닉네임 (2~12자 · 가입 후 글·댓글에 고정 표시)</div>
            <input id="auth-nick" minlength="2" maxlength="12" placeholder="예: 협곡의봄" style="width:100%">
          </div>
          <div id="team-field" style="display:none">
            <div class="form-label">응원팀 (해당 팀 팬 게시판에 글을 쓸 수 있어요)</div>
            <select id="auth-team" style="width:100%"></select>
          </div>
          <div>
            <div class="form-label">이메일</div>
            <input id="auth-email" type="email" required autocomplete="username" style="width:100%">
          </div>
          <div>
            <div class="form-label">비밀번호 (6자 이상)</div>
            <input id="auth-pw" type="password" required minlength="6" autocomplete="current-password" style="width:100%">
          </div>
          <!-- 가입 약관 동의 — 회원가입·프로필 완성 때만 보인다. 서버(create_profile)도 동의 없이는 거부한다 -->
          <div id="consent-field" style="display:none">
            <div class="form-label">가입 동의 (모두 필수)</div>
            <label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer">
              <input type="checkbox" id="agree-age" style="margin-top:3px">
              <span>만 14세 이상입니다</span>
            </label>
            <label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer">
              <input type="checkbox" id="agree-terms" style="margin-top:3px">
              <span><a href="terms.html" target="_blank" style="text-decoration:underline">이용약관</a>에 동의합니다</span>
            </label>
            <label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer">
              <input type="checkbox" id="agree-privacy" style="margin-top:3px">
              <span><a href="privacy.html" target="_blank" style="text-decoration:underline">개인정보 처리방침</a>(이메일·닉네임·응원팀 수집)에 동의합니다</span>
            </label>
          </div>
          <button class="btn-primary" type="submit" id="auth-submit">로그인</button>
          <div class="admin-note" style="border:none; background:none; padding:4px 0 0">
            회원이 되면 닉네임이 고정되어 사칭을 막을 수 있고,
            예측·평점 기록이 계정에 저장되어 다른 기기에서도 이어집니다.<br>
            로그인 없이도 눈팅·글쓰기·예측은 모두 가능합니다.
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="assets/data.js?v=20260807u"></script>
  <script src="assets/vendor/supabase.min.js?v=20260807u"></script>
  <script src="assets/store.js?v=20260807u"></script>
  <script src="assets/app.js?v=20260807u"></script>
  <script>
  storeFresh.then(async () => {
    renderHeader(null, null);
    renderFooter();

    // 이미 로그인·프로필까지 끝난 사람이 들어오면 내 기록으로 보낸다
    if (Auth.session && Auth.profile) { location.href = "my.html"; return; }

    // 동의 확인 — 셋 다 체크해야 true (가입은 프로필 생성 시점에 서버가 다시 검사한다)
    const allAgreed = () => ["agree-age", "agree-terms", "agree-privacy"]
      .every(id => document.getElementById(id).checked);

    // 로그인은 됐지만 프로필(닉네임·응원팀)이 없는 회원 → 프로필 완성 모드
    const completing = !!Auth.session && !Auth.profile;
    if (completing) {
      document.getElementById("auth-team").innerHTML =
        `<option value="">선택 안 함 (전체 게시판만 작성 가능)</option>` +
        TEAMS.map(t => `<option value="${t.id}">${t.name} (${t.abbr})</option>`).join("");
      document.querySelector(".board-toolbar").style.display = "none";
      document.getElementById("auth-email").closest("div").style.display = "none";
      document.getElementById("auth-pw").closest("div").style.display = "none";
      document.getElementById("auth-email").required = false;
      document.getElementById("auth-pw").required = false;
      document.getElementById("nick-field").style.display = "";
      document.getElementById("team-field").style.display = "";
      document.getElementById("consent-field").style.display = "";
      document.getElementById("auth-nick").required = true;
      document.getElementById("auth-title").textContent = "프로필 완성";
      document.getElementById("auth-submit").textContent = "저장하고 시작하기";
      document.getElementById("auth-form").addEventListener("submit", async e => {
        e.preventDefault();
        const nick = document.getElementById("auth-nick").value.trim();
        if (!nick) return;
        if (!allAgreed()) { alert("가입 동의 항목(만 14세·이용약관·개인정보)에 모두 체크해 주세요."); return; }
        const res = await completeProfile(nick, document.getElementById("auth-team").value, true);
        if (res.error) { alert("저장 실패: " + res.error.message); return; }
        alert(`환영합니다, ${nick}님!`);
        location.href = "my.html";   // 로그인 직후엔 내 기록부터 보여 준다
      });
      return; // 아래 로그인/가입 로직은 사용하지 않음
    }

    document.getElementById("auth-team").innerHTML =
      `<option value="">선택 안 함 (전체 게시판만 작성 가능)</option>` +
      TEAMS.map(t => `<option value="${t.id}">${t.name} (${t.abbr})</option>`).join("");

    let mode = "login";
    const tabL = document.getElementById("tab-login"), tabS = document.getElementById("tab-signup");
    function setMode(m) {
      mode = m;
      tabL.classList.toggle("active", m === "login");
      tabS.classList.toggle("active", m === "signup");
      document.getElementById("nick-field").style.display = m === "signup" ? "" : "none";
      document.getElementById("team-field").style.display = m === "signup" ? "" : "none";
      document.getElementById("consent-field").style.display = m === "signup" ? "" : "none";
      document.getElementById("auth-nick").required = m === "signup";
      document.getElementById("auth-title").textContent = m === "login" ? "로그인" : "회원가입";
      document.getElementById("auth-submit").textContent = m === "login" ? "로그인" : "가입하기";
    }
    tabL.addEventListener("click", () => setMode("login"));
    tabS.addEventListener("click", () => setMode("signup"));

    document.getElementById("auth-form").addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim();
      const pw = document.getElementById("auth-pw").value;
      const btn = document.getElementById("auth-submit");
      btn.disabled = true;

      if (mode === "login") {
        const { error } = await sbSignIn(email, pw);
        btn.disabled = false;
        if (error) { alert("로그인 실패: " + error.message); return; }
        location.href = "my.html";   // 로그인 직후엔 내 기록부터 보여 준다
      } else {
        if (!allAgreed()) {
          alert("가입 동의 항목(만 14세·이용약관·개인정보)에 모두 체크해 주세요.");
          btn.disabled = false; return;
        }
        const nick = document.getElementById("auth-nick").value.trim();
        const res = await sbSignUp(email, pw, nick, document.getElementById("auth-team").value, true);
        btn.disabled = false;
        if (res.error) { alert("가입 실패: " + res.error.message); return; }
        if (res.needConfirm) { alert("가입 확인 이메일이 발송되었습니다. 메일함을 확인해 주세요."); return; }
        alert(`환영합니다, ${nick}님!`);
        location.href = "my.html";   // 로그인 직후엔 내 기록부터 보여 준다
      }
    });
  });
  </script>
</body>
</html>
