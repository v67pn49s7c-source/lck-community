<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="TOP·JGL·MID·ADC·SUP 역할에 맞춘 6축을 실제 경기 통계의 동 포지션 백분위로 비교합니다.">
  <link rel="canonical" href="https://lck-community.vercel.app/player.html">
  <meta property="og:url" content="https://lck-community.vercel.app/player.html">
  <meta property="og:site_name" content="The Nexus">
  <meta property="og:locale" content="ko_KR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK 선수 기록 — The Nexus</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("lck_theme") || "dark";</script>
  <meta property="og:title" content="LCK 선수 기록 — The Nexus">
  <meta property="og:description" content="TOP·JGL·MID·ADC·SUP 역할에 맞춘 6축을 실제 경기 통계의 동 포지션 백분위로 비교합니다.">
  <meta property="og:image" content="https://lck-community.vercel.app/assets/brand/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/nexus-icon.png?v=20260815e">
  <link rel="apple-touch-icon" href="/assets/brand/nexus-mobile.png?v=20260815e">
  <link rel="preconnect" href="https://ckbxvhdvhczpxtgkpbsv.supabase.co" crossorigin>
  <link rel="stylesheet" href="assets/styles.css?v=20260815e">
</head>
<body>
  <div class="team-hero" id="player-hero"></div>

  <main class="page">
    <div class="container layout">
      <div class="stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">포지션 역할 지표 <span class="sub">같은 포지션 안에서의 위치 (0~100)</span></h2>
            <div class="chip-row" id="stat-tabs"></div>
          </div>
          <div id="radar-box"></div>
        </section>

        <section class="card" id="summary-card">
          <div class="card-head"><h2 class="card-title">시즌 요약</h2><span class="card-more" id="summary-scope"></span></div>
          <div class="stat-cards" id="player-summary"></div>
        </section>

        <section class="card" id="champ-card">
          <div class="card-head"><h2 class="card-title">사용 챔피언</h2><span class="card-more" id="champ-count"></span></div>
          <div id="champ-table"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">경기별 평점 <span class="sub">경기 단위 팬 평균</span></h2>
            <span class="card-more" id="avg-label"></span>
          </div>
          <div id="rating-history"></div>
        </section>

      </div>

      <aside class="stack">
        <section class="card">
          <div class="card-head"><h2 class="card-title">같은 팀 선수</h2></div>
          <div id="teammates"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">LCK 순위</h2>
          </div>
          <div id="standings-body"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/data.js?v=20260815e"></script>
  <script src="assets/vendor/supabase.min.js?v=20260815e"></script>
  <script src="assets/store.js?v=20260815e"></script>
  <script src="assets/app.js?v=20260815e"></script>
  <script src="assets/story.js?v=20260815e"></script>
  <script src="assets/ddragon.js?v=20260815e"></script>
  <script src="assets/player-photos.js?v=20260815e"></script>
  <script>
  storeReady.then(async () => {
    // ⚠ 없는 id 로 들어와도 "|| getPlayers()[0]" 로 엉뚱한 선수를 보여 주던 자리다.
    //   주소는 ?id=asdf 인데 화면은 다른 선수라 검색엔진이 가짜 페이지를 무한히 만든다.
    //   id 를 아예 안 준 경우(선수 목록에서 온 게 아닌 접근)에만 첫 선수를 보여 준다.
    const askedId = new URLSearchParams(location.search).get("id");
    const player = askedId ? getPlayer(askedId) : getPlayers()[0];
    const team = player ? TEAM_MAP[player.team] : null;
    renderHeader("선수", team ? team.id : null);

    if (!player) {
      document.querySelector("main .stack").innerHTML =
        `<div class="empty-note">선수를 찾을 수 없습니다.<br>
           <a class="btn-secondary" href="players.html" style="display:inline-block;margin-top:10px;text-decoration:none">선수 목록으로</a>
         </div>`;
      noIndex();   // 없는 주소가 검색에 잡히지 않게
    } else {
      // 선수마다 다른 주소·제목·설명 (고정 canonical 이면 50명이 한 장으로 합쳐진다)
      setPageIdentity(["id"], {
        title: `${player.nick} (${team ? team.abbr : ""} ${player.pos}) 기록 — The Nexus`,
        desc: `${player.nick} 선수의 2026 LCK 세트 기록, KDA·킬관여·딜비중과 팬 평점을 한 화면에서.`,
      });

      // 히어로
      const hero = document.getElementById("player-hero");
      hero.style.background = `linear-gradient(120deg, ${team.dark} 0%, #12141b 70%)`;
      hero.innerHTML = `
        <div class="container team-hero-inner">
          ${playerAvatarHTML(player, team.color, true)}
          <div class="team-hero-info">
            <h1><span class="team-text" style="--team-color:${team.color}">${esc(player.nick)}</span> ${esc(player.name)}</h1>
            <p class="desc">${team.name} · ${esc(player.pos)} · ${teamRecordSummary()}</p>
            ${pomPointsFor(player.id) ? `<p class="desc" style="margin-top:4px">
              <b style="color:var(--blue)">POM ${pomPointsFor(player.id).toLocaleString()}pt</b>
              <span style="color:var(--text-dim)">· 경기 MVP ${pomPointsFor(player.id) / 100}회 · 시즌 ${pomRanking().find(x => x.pid === player.id)?.rank || "-"}위</span>
            </p>` : ""}
            <div class="player-fav" id="player-fav"></div>
          </div>
        </div>`;

      // 최애선수 담기 — 목록 카드의 별과 같은 동작이지만, 여기선 글자까지 붙여
      // "무엇을 하는 버튼인지" 를 분명히 한다 (상세 화면은 공간이 넉넉하다).
      function drawFavBtn() {
        const on = isFavPlayer(player.id);
        const box = document.getElementById("player-fav");
        if (!box) return;
        box.innerHTML = `<button type="button" class="fav-star wide${on ? " on" : ""}" data-star="${q(player.id)}"
          aria-pressed="${on}">${on ? "★ 최애선수" : "☆ 최애선수로 담기"}</button>
          <span class="player-fav-hint">${on ? "오늘 경기가 있으면 홈에 표시됩니다"
            : `최대 ${FAV_PLAYER_MAX}명까지 담을 수 있어요`}</span>`;
        bindFavStars(box, drawFavBtn);
      }
      drawFavBtn();

      function teamRecordSummary() {
        const r = cumulativeRankOf(team.id);
        return r ? `팀 시즌 누적 <b>${r.rank}위</b> (${r.w}승 ${r.l}패)` : "";
      }

      // ── 대회 필터 + 육각형 지표 + 시즌 요약 + 챔피언 ──
      let curTid = "";  // "" = 전체
      function renderStats() {
        const tabs = [{ id: "", name: "전체" }].concat(
          getTournaments().map(t => ({ id: t.id, name: t.name.replace(/^2026\s*/, "") })));
        document.getElementById("stat-tabs").innerHTML = tabs.map(t =>
          `<button type="button" data-tid="${esc(t.id)}" class="${t.id === curTid ? "active" : ""}">${esc(t.name)}</button>`).join("");
        document.getElementById("stat-tabs").querySelectorAll("button").forEach(b =>
          b.addEventListener("click", () => { curTid = b.dataset.tid; renderStats(); }));

        const rd = radarData(player.id, curTid || null);
        const box = document.getElementById("radar-box");
        if (!rd || !rd.stats.sets) {
          box.innerHTML = `<div class="empty-note">이 대회의 경기 기록이 아직 없습니다.</div>`;
          document.getElementById("summary-card").style.display = "none";
          document.getElementById("champ-card").style.display = "none";
          return;
        }
        document.getElementById("summary-card").style.display = "";
        document.getElementById("champ-card").style.display = "";

        box.innerHTML = `<div class="radar-wrap">${radarSVG(rd.axes)}${radarBarsHTML(rd.axes)}</div>
          <div class="rd-legend"><span class="me"><i></i>${esc(player.nick)}</span>
            <span class="avg"><i></i>${esc(player.pos)} 평균</span></div>
          <p class="rd-method"><b>${esc(rd.role)}</b> 역할 지표 · 0~100 동 포지션 백분위<br>
            Leaguepedia 세트 종료 실측 기록으로 계산합니다. @15·로밍 동선·솔로킬처럼 원본에 없는 값은
            골드·CS 상대차, 분당 K+A, 팀 오브젝트 등 가장 가까운 실측값을 사용합니다.</p>`;

        const s = rd.stats;
        document.getElementById("summary-scope").textContent =
          (curTid ? (getTournaments().find(t => t.id === curTid) || {}).name || "" : "전체 대회");
        document.getElementById("player-summary").innerHTML = `
          <div class="stat-card"><span class="k">출전 세트</span><span class="v">${s.sets}<em></em></span></div>
          <div class="stat-card"><span class="k">승률</span><span class="v">${s.sets ? Math.round(s.wins / s.sets * 100) : 0}<em>%</em></span>
            <span class="k">${s.wins}승 ${s.losses}패</span></div>
          <div class="stat-card"><span class="k">KDA</span><span class="v">${s.kda.toFixed(2)}<em></em></span>
            <span class="k">${s.k} / ${s.d} / ${s.a}</span></div>
          <div class="stat-card"><span class="k">팬 평점</span><span class="v">${s.fan == null ? "-" : s.fan.toFixed(1)}<em>${s.fan == null ? "" : "점"}</em></span>
            <span class="k">${s.fanCount}경기 평가</span></div>
          ${s.dmgAvg == null ? "" : `
          <div class="stat-card"><span class="k">챔피언 딜량</span><span class="v">${Math.round(s.dmgAvg / 100) / 10}<em>k</em></span>
            <span class="k">팀 내 비중 ${s.dmgShare == null ? "-" : Math.round(s.dmgShare * 100) + "%"}</span></div>`}
          ${s.visAvg == null ? "" : `
          <div class="stat-card"><span class="k">시야 점수</span><span class="v">${s.visAvg.toFixed(0)}<em></em></span>
            <span class="k">세트 평균</span></div>`}
          <div class="stat-card"><span class="k">골드</span><span class="v">${s.goldAvg.toFixed(1)}<em>k</em></span>
            <span class="k">세트 평균 · CS ${s.csAvg.toFixed(0)}</span></div>
          ${s.pentakills ? `<div class="stat-card"><span class="k">펜타킬</span><span class="v">${s.pentakills}<em>회</em></span>
            <span class="k">🔥</span></div>` : ""}`;

        document.getElementById("champ-count").textContent = `${s.champs.length}종`;
        document.getElementById("champ-table").innerHTML = s.champs.length ? `
          <div class="table-scroll"><table class="detail-table">
            <thead><tr><th>챔피언</th><th>세트</th><th>승률</th><th>KDA</th><th>최근 사용</th></tr></thead>
            <tbody>${s.champs.map(c => `<tr>
              <td class="dt-champ">${ddChampHTML ? ddChampHTML(c.champ) : esc(c.champ)}</td>
              <td>${c.sets}</td>
              <td>${Math.round(c.wins / c.sets * 100)}%</td>
              <td class="dt-kda">${c.d > 0 ? ((c.k + c.a) / c.d).toFixed(2) : (c.k + c.a).toFixed(2)}</td>
              <td style="color:var(--text-sub)">${c.last ? fmtDay(c.last) : "-"}</td>
            </tr>`).join("")}</tbody>
          </table></div>` : `<div class="empty-note">기록된 챔피언이 없습니다</div>`;
      }
      window.renderStats = renderStats;
      renderStats();
      if (typeof ddInit === "function") ddInit().then(ok => { if (ok) renderStats(); });

      // 경기별 평점 (경기 단위 팬 평균 + 내 점수)
      window.renderRatingHistory = function () {
      const history = matchRatingsForPlayer(player.id);
      const latest = history[0];
      document.getElementById("avg-label").textContent =
        latest ? `최근 경기 ${latest.avg}점 (${latest.n}명)` : "";
      document.getElementById("rating-history").innerHTML = history.length
        ? history.map(h => {
            const m = h.match;
            const label = m ? `${slotName(m.a)} vs ${slotName(m.b)} · ${fmtWhen(m.at)}` : h.matchId;
            return `
            <a class="post-row" href="/match/${h.matchId}">
              <span class="post-title">${label}</span>
              ${h.mine != null ? `<span class="detail" style="color:var(--text-dim);font-size:12px">내 점수 ${h.mine}</span>` : ""}
              <span class="rate" style="font-weight:800;color:var(--blue)">평균 ${h.avg} (${h.n}명)</span>
            </a>`;
          }).join("")
        : `<div class="empty-note">아직 평점이 없습니다. 경기 종료 후 해당 경기 페이지에서 평가할 수 있어요.</div>`;
      };
      renderRatingHistory();

      // 같은 팀 선수
      document.getElementById("teammates").innerHTML = teamPlayers(team.id)
        .map(p => `
          <a class="post-row ${p.id === player.id ? "active" : ""}" href="player.html?id=${p.id}">
            <span class="tag-cat">${esc(p.pos)}</span>
            <span class="post-title" style="${p.id === player.id ? "color:var(--accent)" : ""}">${esc(p.nick)} <span style="color:var(--text-dim);font-weight:400">${esc(p.name)}</span></span>
            <span class="post-meta">${latestMatchRating(p.id) ? "최근 " + latestMatchRating(p.id).avg + "점" : ""}</span>
          </a>`).join("");
    }

    // 팬 평점은 서버 집계에서 오므로, 스냅샷으로 먼저 그렸다면 도착 후 다시 그린다
    storeFresh.then(() => { if (player) { renderStats(); renderRatingHistory(); } }).catch(() => {});
    setupSidebarStandings();
    renderFooter();
  
  });
  </script>
</body>
</html>
